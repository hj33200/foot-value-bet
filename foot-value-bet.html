<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Foot Value Bet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14;
  --bg2:#0e1420;
  --panel:#131b2a;
  --panel2:#172033;
  --panel3:#1d2a40;
  --line:#243149;
  --line2:#2e3e5c;
  --txt:#eef3fb;
  --txt2:#a8b6cf;
  --txt3:#6f7e9b;
  --accent:#c6ff3d;
  --accent2:#7cf2c8;
  --blue:#3b82f6;
  --green:#27d17c;
  --green-bg:rgba(39,209,124,.14);
  --yellow:#f0c640;
  --yellow-bg:rgba(240,198,64,.14);
  --red:#f0556b;
  --red-bg:rgba(240,85,107,.13);
  --gray:#5d6b86;
  --gray-bg:rgba(93,107,134,.16);
  --radius:16px;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --disp:'Bricolage Grotesque',sans-serif;
  --body:'Instrument Sans',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--body);
  background:
    radial-gradient(1100px 600px at 85% -10%,rgba(124,242,200,.06),transparent 60%),
    radial-gradient(900px 500px at -5% 10%,rgba(59,130,246,.07),transparent 55%),
    var(--bg);
  color:var(--txt);
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.45;
}
::selection{background:var(--accent);color:#0a0e14}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:20px;border:2px solid var(--bg)}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:248px;flex-shrink:0;position:sticky;top:0;height:100vh;
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:22px 16px;gap:6px;z-index:40;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 20px}
.brand-logo{
  width:42px;height:42px;border-radius:13px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;color:#08210f;font-weight:800;font-size:22px;
  box-shadow:0 6px 22px rgba(198,255,61,.28);position:relative;overflow:hidden;
}
.brand-logo::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.6),transparent 50%)}
.brand-name{font-family:var(--disp);font-weight:800;font-size:18px;line-height:1;letter-spacing:-.02em}
.brand-name small{display:block;font-family:var(--body);font-weight:500;font-size:10.5px;color:var(--accent);letter-spacing:.18em;margin-top:4px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.nav-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt3);padding:14px 12px 7px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;
  color:var(--txt2);font-weight:600;font-size:14.5px;transition:.16s;position:relative;
}
.nav-item svg{width:19px;height:19px;flex-shrink:0;stroke-width:2}
.nav-item:hover{background:var(--panel);color:var(--txt)}
.nav-item.active{background:linear-gradient(90deg,rgba(198,255,61,.16),rgba(198,255,61,.04));color:var(--txt)}
.nav-item.active::before{content:"";position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:4px;height:22px;border-radius:0 4px 4px 0;background:var(--accent)}
.nav-item .badge{margin-left:auto;background:var(--accent);color:#0a0e14;font-size:11px;font-weight:800;padding:1px 8px;border-radius:20px;font-family:var(--mono)}
.side-foot{margin-top:auto;padding:14px 12px 4px;border-top:1px solid var(--line);font-size:11.5px;color:var(--txt3);line-height:1.5}
.side-foot b{color:var(--txt2)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:30px}
.topbar{
  position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);
  background:rgba(10,14,20,.72);border-bottom:1px solid var(--line);
  padding:16px 30px;display:flex;align-items:center;gap:16px;
}
.topbar h1{font-family:var(--disp);font-size:23px;font-weight:800;letter-spacing:-.02em}
.topbar .sub{color:var(--txt3);font-size:13px;margin-top:2px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.kpi{display:flex;flex-direction:column;align-items:flex-end;padding:0 14px;border-left:1px solid var(--line)}
.kpi b{font-family:var(--mono);font-size:16px;font-weight:700}
.kpi span{font-size:10.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em}
.kpi b.pos{color:var(--green)} .kpi b.neg{color:var(--red)}
.content{padding:26px 30px;max-width:1240px;width:100%}

/* ---------- Generic ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:11px;font-weight:700;font-size:14px;transition:.16s;
  background:var(--panel2);border:1px solid var(--line2);color:var(--txt);
}
.btn:hover{border-color:var(--line2);background:var(--panel3)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#9be23a);color:#0a210f;border:none;box-shadow:0 6px 20px rgba(198,255,61,.22)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;border:1px solid var(--line2)}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:9px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:7px;letter-spacing:.02em}
.tag-soft{background:var(--panel3);color:var(--txt2);border:1px solid var(--line2)}
.tag-live{background:var(--red-bg);color:var(--red)}
.tag-live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(240,85,107,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,85,107,.55)}70%{box-shadow:0 0 0 7px rgba(240,85,107,0)}100%{box-shadow:0 0 0 0 rgba(240,85,107,0)}}
.tag-up{background:rgba(59,130,246,.14);color:#7ab0ff}
.tag-fin{background:var(--gray-bg);color:var(--txt2)}

.crest{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:15px;color:#fff;flex-shrink:0;position:relative;overflow:hidden;letter-spacing:-.02em}
.crest::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 28% 20%,rgba(255,255,255,.4),transparent 55%);mix-blend-mode:overlay}
.crest.sm{width:34px;height:34px;font-size:12px;border-radius:10px}
.crest.lg{width:64px;height:64px;font-size:20px;border-radius:18px}

.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stagger>*{animation:fade .4s ease both}
.stagger>*:nth-child(2){animation-delay:.04s}.stagger>*:nth-child(3){animation-delay:.08s}
.stagger>*:nth-child(4){animation-delay:.12s}.stagger>*:nth-child(5){animation-delay:.16s}
.stagger>*:nth-child(6){animation-delay:.2s}

/* ---------- Filters bar ---------- */
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;padding:18px;margin-bottom:22px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:11.5px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em}
.field select,.field input{
  background:var(--bg2);border:1px solid var(--line2);color:var(--txt);
  padding:11px 13px;border-radius:11px;min-width:190px;outline:none;font-weight:600;transition:.16s;
}
.field select:focus,.field input:focus{border-color:var(--accent)}
.field.grow{flex:1}

/* ---------- Match cards (dashboard) ---------- */
.match-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.match-card{padding:18px;display:flex;flex-direction:column;gap:15px;transition:.18s;cursor:pointer;position:relative;overflow:hidden}
.match-card:hover{border-color:var(--line2);transform:translateY(-3px);box-shadow:0 14px 38px rgba(0,0,0,.35)}
.match-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),transparent 70%);opacity:0;transition:.2s}
.match-card:hover::before{opacity:1}
.mc-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--txt3);font-weight:600}
.mc-league{display:flex;align-items:center;gap:7px}
.mc-flag{width:18px;height:13px;border-radius:3px;flex-shrink:0}
.mc-teams{display:flex;align-items:center;gap:12px}
.mc-team{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.mc-team .nm{font-weight:700;font-size:14px;line-height:1.2}
.mc-mid{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px}
.mc-time{font-family:var(--mono);font-size:20px;font-weight:700}
.mc-vs{font-size:11px;color:var(--txt3);font-weight:700}
.mc-odds{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mc-odd{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:7px 4px;text-align:center}
.mc-odd span{display:block;font-size:10.5px;color:var(--txt3);font-weight:700}
.mc-odd b{font-family:var(--mono);font-size:14px}
.mc-foot{display:flex;align-items:center;gap:10px}

/* ---------- Detail header ---------- */
.back-link{display:inline-flex;align-items:center;gap:7px;color:var(--txt2);font-weight:600;font-size:13.5px;margin-bottom:16px}
.back-link:hover{color:var(--accent)}
.detail-head{padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.detail-head .glow{position:absolute;inset:0;opacity:.5;background:radial-gradient(600px 200px at 20% 0%,rgba(59,130,246,.12),transparent 60%),radial-gradient(600px 200px at 80% 0%,rgba(240,85,107,.1),transparent 60%)}
.dh-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:relative;margin-bottom:20px}
.dh-row{display:flex;align-items:center;justify-content:center;gap:24px;position:relative}
.dh-team{display:flex;flex-direction:column;align-items:center;gap:11px;flex:1;text-align:center}
.dh-team .nm{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.02em}
.dh-team .rk{font-size:12px;color:var(--txt3);font-weight:600}
.dh-center{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:120px}
.dh-vs{font-family:var(--disp);font-size:30px;font-weight:800;color:var(--txt3)}
.dh-datetime{font-family:var(--mono);font-size:13px;color:var(--txt2);text-align:center}

.section-title{display:flex;align-items:center;gap:10px;margin:28px 0 14px;font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:-.01em}
.section-title .dot{width:9px;height:9px;border-radius:3px;background:var(--accent)}
.section-title .hint{margin-left:auto;font-family:var(--body);font-size:12px;color:var(--txt3);font-weight:500}

/* ---------- Stats ---------- */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat-block{padding:18px}
.stat-block h3{font-size:13px;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.srow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.srow:last-child{border:none}
.srow .lbl{color:var(--txt2)}
.srow .val{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-weight:700}
.srow .val .h{color:var(--blue)} .srow .val .a{color:var(--red)}
.bar{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;display:flex;margin:5px 0 11px}
.bar .h{background:var(--blue)} .bar .a{background:var(--red)}
.form-pills{display:flex;gap:5px}
.fp{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;font-family:var(--mono);color:#0a0e14}
.fp.V{background:var(--green)}.fp.W{background:var(--green)}.fp.N{background:var(--yellow)}.fp.D{background:var(--yellow)}.fp.L{background:var(--red);color:#fff}
.h2h-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.h2h-row:last-child{border:none}
.h2h-row .d{font-family:var(--mono);font-size:11px;color:var(--txt3)}
.h2h-score{font-family:var(--mono);font-weight:700;background:var(--bg2);padding:3px 11px;border-radius:8px;border:1px solid var(--line)}
.h2h-row .t1{text-align:right}.h2h-row .t2{text-align:left}

/* ---------- Markets / odds ---------- */
.market{margin-bottom:12px;overflow:hidden}
.market-head{display:flex;align-items:center;gap:11px;padding:15px 18px;cursor:pointer;user-select:none;transition:.15s}
.market-head:hover{background:var(--panel2)}
.market-head .mh-name{font-weight:700;font-size:15px}
.market-head .mh-count{font-family:var(--mono);font-size:11px;color:var(--txt3);background:var(--bg2);padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
.market-head .mh-best{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--txt3);font-weight:600}
.market-head .chev{transition:.2s;color:var(--txt3)}
.market.collapsed .chev{transform:rotate(-90deg)}
.market.collapsed .market-body{display:none}
.market-body{padding:6px 14px 16px}
.odds-grid{display:grid;gap:9px}
.odds-grid.c2{grid-template-columns:repeat(2,1fr)}
.odds-grid.c3{grid-template-columns:repeat(3,1fr)}
.odds-grid.c4{grid-template-columns:repeat(4,1fr)}
.odd-btn{
  background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left;transition:.15s;position:relative;overflow:visible;
}
.odd-btn:hover{border-color:var(--accent);background:var(--panel2);transform:translateY(-2px)}
.odd-btn .ob-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.ob-top-badges{display:flex;gap:5px}
.ob-top-badges .voyant{width:10px;height:10px}
.odd-btn .ob-sel{font-weight:700;font-size:13px;color:var(--txt);line-height:1.2}
.ob-cote-row{display:flex;align-items:center;gap:10px;margin:12px 0 8px}
.odd-btn .ob-cote-display{font-family:var(--mono);font-weight:700;font-size:24px}
.btn-edit{background:transparent;border:none;padding:6px 8px;cursor:pointer;font-size:18px;opacity:0;transition:.2s;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;user-select:none;flex-shrink:0}
.odd-btn:hover .btn-edit{opacity:0.7}
.odd-btn:hover .btn-edit:hover{opacity:1;color:var(--accent);background:rgba(100,200,255,0.1)}
.odd-btn .ob-scores{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:11px;color:var(--txt3)}
.ob-score-item{display:flex;align-items:center;gap:6px;padding:4px 6px;background:rgba(0,0,0,0.15);border-radius:6px}
.ob-score-item .voyant{width:8px;height:8px}
.ob-score-item .score-label{font-weight:600;font-size:10px;color:var(--txt2);min-width:40px}
.ob-score-item .score-value{font-weight:700;margin-left:auto;color:var(--txt);min-width:35px;text-align:right}
.voyant{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
.v-green{background:var(--green);box-shadow:0 0 8px var(--green)}
.v-yellow{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.v-red{background:var(--red)}
.v-gray{background:var(--gray)}
.odd-btn.green{border-color:rgba(39,209,124,.4)}
.odd-btn.green .ob-stats .v{color:var(--green)}
.odd-btn.green::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green)}
.odd-btn.yellow .ob-stats .v{color:var(--yellow)}
.odd-btn.red .ob-stats .v{color:var(--red);opacity:.85}
.odd-btn.red{opacity:.82}
.odd-btn.gray{opacity:.6;cursor:not-allowed}
.odd-btn.gray:hover{transform:none;border-color:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--txt2);padding:14px 18px;margin-bottom:16px;font-weight:600}
.legend span{display:flex;align-items:center;gap:7px}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
thead th{text-align:left;padding:13px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);font-weight:700;background:var(--bg2);border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel2)}
.t-mono{font-family:var(--mono);font-weight:700}
.t-match{display:flex;align-items:center;gap:9px;min-width:170px;white-space:normal}
.t-match .nm{font-weight:700;font-size:12.5px;line-height:1.25}
.t-match .lg{font-size:11px;color:var(--txt3)}
.t-note{max-width:180px;white-space:normal;color:var(--txt2);font-size:12px}
.status-sel{background:var(--bg2);border:1px solid var(--line2);color:var(--txt);padding:6px 9px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer}
.pill{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:7px;display:inline-block}
.pill.attente{background:rgba(59,130,246,.14);color:#7ab0ff}
.pill.gagne{background:var(--green-bg);color:var(--green)}
.pill.perdu{background:var(--red-bg);color:var(--red)}
.pill.annule{background:var(--gray-bg);color:var(--txt2)}
.vbadge{font-family:var(--mono);font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px}
.vbadge.green{background:var(--green-bg);color:var(--green)}
.vbadge.yellow{background:var(--yellow-bg);color:var(--yellow)}
.vbadge.red{background:var(--red-bg);color:var(--red)}
.conf{display:inline-flex;align-items:center;gap:2px}
.conf b{font-family:var(--mono);font-size:13px}
.profit.pos{color:var(--green);font-weight:700}.profit.neg{color:var(--red);font-weight:700}
.empty{padding:50px 20px;text-align:center;color:var(--txt3)}
.empty svg{width:48px;height:48px;margin-bottom:12px;opacity:.5}

.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.scard{padding:17px}
.scard .lab{font-size:11.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:8px}
.scard .num{font-family:var(--mono);font-size:25px;font-weight:700}
.scard .num.pos{color:var(--green)}.scard .num.neg{color:var(--red)}
.scard .sub{font-size:12px;color:var(--txt3);margin-top:3px}

/* ---------- Settings ---------- */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.set-block{padding:20px}
.set-block h3{font-family:var(--disp);font-size:16px;font-weight:800;margin-bottom:4px}
.set-block .desc{font-size:12.5px;color:var(--txt3);margin-bottom:16px}
.set-field{margin-bottom:15px}
.set-field>label{display:block;font-size:12.5px;font-weight:700;color:var(--txt2);margin-bottom:7px}
.set-field input[type=text],.set-field input[type=number],.set-field input[type=password],.set-field select{
  width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--txt);padding:11px 13px;border-radius:11px;outline:none;font-weight:600
}
.set-field input:focus,.set-field select:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:9px;background:var(--bg2);border:1px solid var(--line2);font-weight:700;font-size:13px;color:var(--txt2);transition:.15s}

let currentMonth = new Date();
function toggleDatePicker() {
  const container = document.getElementById('datePickerContainer');
  if (!container) return;
  container.classList.toggle('active');
  if (container.classList.contains('active')) renderCalendar();
}
function renderCalendar() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  const firstDay = (new Date(year, month, 1).getDay() - 1 + 7) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  document.getElementById('monthYear').textContent = currentMonth.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  const grid = document.getElementById('calendarGrid');
  if (!grid) return;
  grid.innerHTML = '';
  ['L','M','M','J','V','S','D'].forEach(d => { const div = document.createElement('div'); div.textContent = d; div.style.fontWeight='bold'; div.style.textAlign='center'; grid.appendChild(div); });
  for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));
  const today = new Date().toISOString().slice(0,10);
  for (let day = 1; day <= daysInMonth; day++) {
    const btn = document.createElement('button');
    btn.textContent = day;
    const dateStr = String(year).padStart(4,'0')+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    if (dateStr === today) btn.classList.add('today');
    btn.onclick = () => { state.filterDate = dateStr; document.getElementById('dateInput').value = dateStr; document.getElementById('datePickerContainer').classList.remove('active'); render(); };
    grid.appendChild(btn);
  }
}
function prevMonth() { currentMonth.setMonth(currentMonth.getMonth()-1); renderCalendar(); }
function nextMonth() { currentMonth.setMonth(currentMonth.getMonth()+1); renderCalendar(); }
document.addEventListener('click', function(e) {
  const c = document.getElementById('datePickerContainer');
  if (c && !e.target.closest('#datePickerContainer') && !e.target.closest('#dateInput')) c.classList.remove('active');
});

<script>
/* ============================================================
   FOOT VALUE BET — moteur + state + rendu
   ============================================================ */

/* ---------- util: seeded RNG & poisson ---------- */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const FACT=[1,1,2,6,24,120,720,5040,40320,362880,3628800];
function pois(k,l){return Math.exp(-l)*Math.pow(l,k)/FACT[k]}


// 🎲 NEGATIVE BINOMIAL - capture l'overdispersion (variance > lambda)
function negBinom(k, lambda) {
  const r = Math.max(0.5, lambda / 1.5);
  const p = r / (r + lambda);
  
  let coeff = 1;
  for (let i = 0; i < k; i++) {
    coeff *= (k + r - 1 - i) / (i + 1);
  }
  
  return coeff * Math.pow(p, r) * Math.pow(1 - p, k);
}

// 📊 CALCULER BTTS EMPIRIQUE À PARTIR DES DONNÉES RÉELLES
function calculateBTTSEmpirical(homeMatches, awayMatches) {
  if (!homeMatches || !awayMatches || homeMatches.length === 0 || awayMatches.length === 0) {
    return { corrFactor: 1.0, empiricalBTTS: null, poissonBTTS: null, dataPoints: 0 };
  }
  
  // Compter: P(Home marque), P(Away marque), P(BTTS)
  let homeScored = 0, awayScored = 0, bttsCount = 0;
  const n = Math.min(homeMatches.length, awayMatches.length, 15);  // Utiliser 15 derniers matchs max
  
  // Analyser matchs Home
  for (let i = 0; i < n; i++) {
    const m = homeMatches[i];
    if (m && m.goals && m.goals.for !== undefined) {
      if (m.goals.for >= 1) homeScored++;
    }
  }
  
  // Analyser matchs Away
  for (let i = 0; i < n; i++) {
    const m = awayMatches[i];
    if (m && m.goals && m.goals.for !== undefined) {
      if (m.goals.for >= 1) awayScored++;
    }
  }
  
  // Empirique: P(Home marque) et P(Away marque)
  const pHome_emp = homeScored / n;
  const pAway_emp = awayScored / n;
  const empiricalBTTS = pHome_emp * pAway_emp;
  
  // Poisson indépendant (théorique)
  const pHome_pois = 1 - Math.exp(-homeMatches.reduce((s, m) => s + (m?.goals?.for || 0), 0) / n);
  const pAway_pois = 1 - Math.exp(-awayMatches.reduce((s, m) => s + (m?.goals?.for || 0), 0) / n);
  const poissonBTTS = pHome_pois * pAway_pois;
  
  // Corrélation = empirique / théorique
  const corrFactor = poissonBTTS > 0 ? empiricalBTTS / poissonBTTS : 1.0;
  
  
  return { corrFactor, empiricalBTTS, poissonBTTS, pHome_emp, pAway_emp, dataPoints: n };
}

/* ---------- match model (Poisson) ---------- */
// 📊 Récupérer les STATISTICS avancées (xG, possession, tirs, etc.)
async function getAdvancedStats(fixtureId) {
  try {
    const url = `https://foot-value-bet.vercel.app/api/proxy?endpoint=statistics&fixture=${fixtureId}`;
    const response = await fetch(url);
    if (!response.ok) return null;
    const data = await response.json();
    
    if (!data.response || data.response.length < 2) return null;
    
    const homeStats = data.response[0]?.statistics || [];
    const awayStats = data.response[1]?.statistics || [];
    
    // Extraire xG, possession, tirs
    const getStatValue = (stats, key) => {
      const stat = stats.find(s => s.type?.toLowerCase() === key.toLowerCase());
      return stat ? parseFloat(stat.value) : null;
    };
    
    return {
      homeXG: getStatValue(homeStats, 'expected_goals') || 0,
      homeShots: getStatValue(homeStats, 'shots on goal') || 0,
      homePossession: getStatValue(homeStats, 'ball possession') || 50,
      awayXG: getStatValue(awayStats, 'expected_goals') || 0,
      awayShots: getStatValue(awayStats, 'shots on goal') || 0,
      awayPossession: getStatValue(awayStats, 'ball possession') || 50,

// 🎯 Convertir ranking FIFA → Elo (linéaire)
function rankingToElo(ranking) {
  // Formule: Elo = 1850 - (ranking × 2.5)
  // Rang 1 = 1850, Rang 50 = 1725, Rang 100 = 1600, Rang 200 = 1350
  const elo = 1850 - (ranking * 2.5);
  return clamp(elo, 1200, 1900);
}

// 🎯 Calculer la force d'une équipe (opponent strength) - SANS REQUÊTE
function getOpponentStrength(teamId, teamName) {
  if (ELO_CACHE[teamId]) return ELO_CACHE[teamId];
  
  // ✅ NOUVEAU: Chercher ranking FIFA (zéro requête!)
  const ranking = FIFA_RANKINGS[teamName];
  
  if (ranking) {
    const elo = rankingToElo(ranking);
    ELO_CACHE[teamId] = elo;
    return elo;
  }
  
  // Fallback: stats en cache si disponibles
  const stats = FOOTBALL_API.getTeamStats(teamId);
  if (stats && stats.form) {
    const elo = calculateEloFromResults(teamName, stats.form, stats.gf, stats.ga, stats.form.length);
    ELO_CACHE[teamId] = elo;
    return elo;
  }
  
  // Dernier fallback: prior neutre
  return 1600;
}

// 🎯 Calculer SOS (Strength of Schedule) - force des adversaires
function calculateSOS(teamId, teamName, matches, competitionType = 'CHAMPIONSHIP') {
  if (!matches || !Array.isArray(matches) || matches.length === 0) {
    return { sos: 1.0, competitionType };
  }
  
  const compProps = getCompetitionProperties(competitionType);
  let totalAdversaire = 0;
  let totalPoids = 0;
  let validMatches = 0;
  
  
  try {
    matches.forEach((m, idx) => {
      if (!m || !m.teams || !m.teams.home || !m.teams.away) {
        return;
      }
      
      const isHome = m.teams.home.id == teamId;
      const opponent = isHome ? m.teams.away : m.teams.home;
      const opponentId = opponent.id;
      
      const opponentElo = getOpponentStrength(opponentId, opponent.name);
      const weight = (idx + 1) / matches.length;
      const eloRatio = opponentElo / 1600;
      
      let adversaireForce = eloRatio;
      if (!compProps.isNeutralGround && !isHome) {
        adversaireForce *= 1.03;
      }
      
      totalAdversaire += adversaireForce * weight;
      totalPoids += weight;
      validMatches++;
      
      const posLabel = isHome ? '🏠 dom.' : '✈️ ext.';
    });
  } catch (e) {
    console.warn(`⚠️ Erreur lors du calcul SOS:`, e);
    return { sos: 1.0, competitionType };
  }
  
  if (validMatches === 0 || totalPoids === 0) {
    return { sos: 1.0, competitionType };
  }
  
  const sos = totalAdversaire / totalPoids;
  
  return { sos, competitionType };
}

function calculateEloFromResults(teamName, form, gf, ga, matches) {
  const PRIOR_ELO = 1600;
  if (!form || form.length === 0) return PRIOR_ELO;
  
  
  // 1️⃣ WIN RATE
  const winCount = form.split('').reduce((s,c) => s + (c==='V'?1:0), 0);
  const drawCount = form.split('').reduce((s,c) => s + (c==='D'?1:0), 0);
  const winRate = (winCount * 3 + drawCount) / (form.length * 3);
  
  
  // RÉDUIT de 600 → 350 (moins extrême)
  const performanceBonus = (winRate - 0.5) * 350;
  
  // 2️⃣ BUTS/MATCH
  const goalsFor = gf / Math.max(1, matches);
  const goalsAgainst = ga / Math.max(1, matches);
  const goalsDiff = goalsFor - goalsAgainst;
  
  
  // RÉDUIT de 250 → 120 (moins extrême)
  const goalsBonus = goalsDiff * 120;
  
  // Elo brut
  let eloRaw = PRIOR_ELO + performanceBonus + goalsBonus;
  
  // 3️⃣ FACTEUR DE CONFIANCE (basé sur le nombre de matchs)
  // 5 matches = 70% confident
  // 10 matches = 85% confident
  // 20 matches = 95% confident
  const confidence = Math.min(0.95, 0.4 + (matches / 30));
  
  // Blend: Prior + Elo_calculé pondéré par confiance
  let elo = PRIOR_ELO * (1 - confidence) + eloRaw * confidence;
  
  // LISSER LES EXTRÊMES: min 1200, max 2000 (au lieu de 800-2800)
  elo = clamp(elo, 1200, 2000);
  
  return elo;
}

function getElo(teamId, teamName, form, gf, ga, matches) {
  if (ELO_CACHE[teamId]) return ELO_CACHE[teamId];
  
  const elo = calculateEloFromResults(teamName, form, gf, ga, matches);
  ELO_CACHE[teamId] = elo;
  
  return elo;
}

function getWinProbabilityFromElo(eloHome, eloAway) {
  const eloRatingDiff = eloHome - eloAway;
  const probability = 1 / (1 + Math.pow(10, -eloRatingDiff / 400));
  return probability;
}

// 🎯 MODÈLE AVANCÉ: Calculer les probabilités avec TOUTES les données réelles
// 📊 ANALYSE SPORTIVE RÉELLE (COMME LES BOOKMAKERS)
// Comparer l'offensive d'une équipe avec la défense de l'adversaire
// ⚠️ Attention: Terrain neutre en Coupe du Monde = pas de distinction Home/Away
function calculateBookmakerAnalysis(homeLastMatches, awayLastMatches, homeId, awayId, isNeutralGround = false) {
  
  // 1️⃣ CALCULER STATS OFFENSIVES ET DÉFENSIVES
  const analyzeTeam = (matches, teamId) => {
    let goalsFor = 0, goalsAgainst = 0, wins = 0, draws = 0, losses = 0;
    let matchCount = 0;
    
    matches.forEach(m => {
      const isHome = m.teams.home.id == teamId;
      const myGoals = isHome ? m.goals.home : m.goals.away;
      const oppGoals = isHome ? m.goals.away : m.goals.home;
      
      goalsFor += myGoals;
      goalsAgainst += oppGoals;
      matchCount++;
      
      if (myGoals > oppGoals) wins++;
      else if (myGoals === oppGoals) draws++;
      else losses++;
    });
    
    const n = Math.max(matchCount, 1);
    return {
      goalsForPerMatch: goalsFor / n,        // Buts marqués par match
      goalsAgainstPerMatch: goalsAgainst / n, // Buts encaissés par match
      wins, draws, losses, matchCount,
      winRate: wins / n,
      drawRate: draws / n,
      lossRate: losses / n
    };
  };
  
  const homeStats = analyzeTeam(homeLastMatches, homeId);
  const awayStats = analyzeTeam(awayLastMatches, awayId);
  
  // 2️⃣ COMPARER OFFENSIVE vs DÉFENSE (LOGIQUE BOOKMAKER)
  // 🎯 EN COUPE DU MONDE: Pas de distinction Home/Away
  // On utilise les stats globales sans avantage domicile
  
  let homeOffensiveVsAwayDefense, awayOffensiveVsHomeDefense;
  
  if (isNeutralGround) {
    // TERRAIN NEUTRE: Moyenne des stats de chaque équipe
    const homeAverageDef = (homeStats.goalsAgainstPerMatch + awayStats.goalsAgainstPerMatch) / 2;
    const awayAverageDef = (homeStats.goalsAgainstPerMatch + awayStats.goalsAgainstPerMatch) / 2;
    homeOffensiveVsAwayDefense = homeStats.goalsForPerMatch / Math.max(awayStats.goalsAgainstPerMatch, 0.5);
    awayOffensiveVsHomeDefense = awayStats.goalsForPerMatch / Math.max(homeStats.goalsAgainstPerMatch, 0.5);
  } else {
    // CHAMPIONNAT: Distinction domicile/extérieur
    homeOffensiveVsAwayDefense = homeStats.goalsForPerMatch / Math.max(awayStats.goalsAgainstPerMatch, 0.5);
    awayOffensiveVsHomeDefense = awayStats.goalsForPerMatch / Math.max(homeStats.goalsAgainstPerMatch, 0.5);
  }
  
  // 3️⃣ ANALYSER MATCHS POUR STATISTIQUES DÉTAILLÉES
  const analyzeMatches = (matches, teamId) => {
    let scored = 0, conceded = 0, btts = 0, over25 = 0, cleanSheets = 0, losses = 0;
    let n = 0;
    
    matches.forEach(m => {
      const isHome = m.teams.home.id == teamId;
      const myGoals = isHome ? m.goals.home : m.goals.away;
      const oppGoals = isHome ? m.goals.away : m.goals.home;
      
      if (myGoals > 0) scored++;
      if (oppGoals > 0) conceded++;
      if (myGoals > 0 && oppGoals > 0) btts++;
      if (myGoals + oppGoals > 2.5) over25++;
      if (oppGoals === 0) cleanSheets++;
      if (myGoals < oppGoals) losses++;
      n++;
    });
    
    return {
      scoredPercent: scored / Math.max(n, 1),
      concededPercent: conceded / Math.max(n, 1),
      bttsPercent: btts / Math.max(n, 1),
      over25Percent: over25 / Math.max(n, 1),
      cleanSheetPercent: cleanSheets / Math.max(n, 1),
      lossPercent: losses / Math.max(n, 1)
    };
  };
  
  const homeMatches = analyzeMatches(homeLastMatches, homeId);
  const awayMatches = analyzeMatches(awayLastMatches, awayId);
  
  // 4️⃣ FORM RÉCENTE (poids plus élevé aux matchs récents)
  const calculateForm = (matches, teamId) => {
    let recentPoints = 0, recentWeight = 0;
    matches.slice(-5).forEach((m, idx) => {
      const isHome = m.teams.home.id == teamId;
      const myGoals = isHome ? m.goals.home : m.goals.away;
      const oppGoals = isHome ? m.goals.away : m.goals.home;
      const weight = idx + 1; // Récents = plus lourd
      
      if (myGoals > oppGoals) recentPoints += 3 * weight;
      else if (myGoals === oppGoals) recentPoints += 1 * weight;
      
      recentWeight += 3 * weight;
    });
    return recentWeight > 0 ? recentPoints / recentWeight : 0.5;
  };
  
  const homeFormScore = calculateForm(homeLastMatches, homeId);
  const awayFormScore = calculateForm(awayLastMatches, awayId);
  
  return {
    homeStats, awayStats,
    homeOffensiveVsAwayDefense, awayOffensiveVsHomeDefense,
    homeMatches, awayMatches,
    homeFormScore, awayFormScore,
    isNeutralGround
  };
}

// 🎯 CALCUL 1N2 AVANCÉ - HYBRIDE DATA + ANALYSE SPORTIVE
// Combine win rates observés (60%) + Elo qualité adversaires (40%)
// Ça c'est une analyse FINE comme demandé!
function calculate1N2Advanced(bookmakerData, homeId, awayId, homeLastMatches, awayLastMatches, competitionType = 'CHAMPIONSHIP') {
  
  // 1️⃣ EXTRAIRE WIN RATES HISTORIQUES
  const homeWinRate = bookmakerData.homeStats.winRate;
  const homeDrawRate = bookmakerData.homeStats.drawRate;
  const awayWinRate = bookmakerData.awayStats.winRate;
  
  // 2️⃣ CALCULER PROBABILITÉ ELO
  const homeElo = getElo(homeId, 'Home', '', 0, 0, 1);
  const awayElo = getElo(awayId, 'Away', '', 0, 0, 1);
  const eloWinProb = getWinProbabilityFromElo(homeElo, awayElo);
  
  // 3️⃣ CALCULER SOS
  const sosHome = calculateSOS(homeId, 'Home', homeLastMatches, 'CHAMPIONSHIP');
  const sosAway = calculateSOS(awayId, 'Away', awayLastMatches, 'CHAMPIONSHIP');
  
  // 4️⃣ COMBINER: 30% historique + 70% Elo pour Coupe du Monde
  const isWorldCup = competitionType === 'WORLD_CUP';
  const historicalWeight = isWorldCup ? 0.3 : 0.6;
  const eloWeight = isWorldCup ? 0.7 : 0.4;
  
  const pH_historical = homeWinRate;
  const pH_elo = eloWinProb;
  const pH_mixed = (pH_historical * historicalWeight) + (pH_elo * eloWeight);
  
  // 5️⃣ NULS: Réduire selon déséquilibre
  const eloDiff = Math.abs(homeElo - awayElo);
  const drawWeight = eloDiff > 500 ? 0.3 : (eloDiff > 300 ? 0.5 : 0.7);
  const pD_final = homeDrawRate * drawWeight;
  
  // 6️⃣ AWAY
  const pA_historical = awayWinRate;
  const pA_elo = 1 - eloWinProb;
  const pA_mixed = (pA_historical * historicalWeight) + (pA_elo * eloWeight);
  
  // 7️⃣ NORMALISER
  const total = pH_mixed + pA_mixed;
  const pH = (pH_mixed / total) * (1 - pD_final);
  const pA = (pA_mixed / total) * (1 - pD_final);
  const pD = pD_final;
  
  // 🔍 DEBUG
  console.log(`🔍 DEBUG calculate1N2Advanced (${homeId} vs ${awayId}):`);
  console.log(`   homeWinRate=${r2(homeWinRate)}, homeElo=${homeElo}, eloWinProb=${r2(eloWinProb)}`);
  console.log(`   pH_historical=${r2(pH_historical)}, pH_elo=${r2(pH_elo)}`);
  console.log(`   historicalWeight=${historicalWeight}, eloWeight=${eloWeight}`);
  console.log(`   pH_mixed=${r2(pH_mixed)}, pA_mixed=${r2(pA_mixed)}`);
  console.log(`   AVANT normalisation: pH=${r2(pH)}, pD=${r2(pD)}, pA=${r2(pA)}`);
  
  return { 
    pH, pD, pA,
    homeElo, awayElo, eloWinProb,
    sosHome, sosAway,
    homeWinRate, homeDrawRate, awayWinRate,
    pH_historical, pH_elo, pH_mixed
  };
}

// 📊 MÉTHODES FINES POUR TOUS LES MARCHÉS
// Même approche que 1N2: 60% Historique + 40% Analyse fine

// 🎯 OVER/UNDER FINE
function calculateOverUnderPoisson(lambdaHome, lambdaAway) {
  // Calcule P(Total buts > threshold) pour différents seuils
  const calculateOverThreshold = (lH, lA, threshold) => {
    let pUnder = 0;
    // Somme toutes les combinaisons où total ≤ threshold
    for (let h = 0; h <= Math.ceil(threshold); h++) {
      for (let a = 0; a <= Math.ceil(threshold - h); a++) {
        if (h + a <= threshold) {
          pUnder += poissonProb(lH, h) * poissonProb(lA, a);
        }
      }
    }
    return 1 - pUnder; // Over = 1 - Under
  };
  
  const ou15 = calculateOverThreshold(lambdaHome, lambdaAway, 1.5);
  const ou25 = calculateOverThreshold(lambdaHome, lambdaAway, 2.5);
  const ou35 = calculateOverThreshold(lambdaHome, lambdaAway, 3.5);
  
  return { ou15, ou25, ou35 };
}

// 🎯 BTTS FINE
function calculateBTTSPoisson(lambdaHome, lambdaAway) {
  // Probabilité Poisson que chaque équipe marque ≥ 1 but
  const pHomeScores = 1 - Math.exp(-lambdaHome);
  const pAwayScores = 1 - Math.exp(-lambdaAway);
  
  // BTTS = probabilité que les DEUX marquent
  const pBTTS = pHomeScores * pAwayScores;
  
  return { pBTTS, pHomeScores, pAwayScores };
}

// 🎯 CLEAN SHEET FINE
function calculateCleanSheetPoisson(lambdaDefense) {
  // P(Clean Sheet) = P(0 buts encaissés) = e^(-lambda)
  const pClean = Math.exp(-lambdaDefense);
  return pClean;
}

// 🎯 SCORING PROBABILITY (Team marque) FINE
function calculateScoringProbabilityFine(bookmakerData, goalsExpected, isHome) {
  // Historique brut (60%)
  const scoring_historical = isHome ? 
    bookmakerData.homeMatches.scoredPercent : 
    bookmakerData.awayMatches.scoredPercent;
  
  // Analyse fine (40%): P(score > 0) = 1 - P(0 buts)
  const scoring_theoretical = 1 - Math.exp(-goalsExpected);
  
  // Combiner
  const scoring_final = (scoring_historical * 0.6) + (scoring_theoretical * 0.4);
  
  return scoring_final;
}

// 🎯 GOALS HOME/AWAY FINE
function calculateGoalsFine(bookmakerData, goalsExpected, isHome) {
  // Historique brut (60%)
  const goals_historical = isHome ? 
    bookmakerData.homeMatches.over25Percent : 
    bookmakerData.awayMatches.over25Percent;
  
  // Analyse fine (40%): Basée sur lambda réelle
  const over15_theoretical = calculatePoissonThreshold(goalsExpected, 1.5);
  const over25_theoretical = calculatePoissonThreshold(goalsExpected, 2.5);
  const over35_theoretical = calculatePoissonThreshold(goalsExpected, 3.5);
  
  // Combiner
  const over15_final = (Math.min(1, goals_historical + 0.25) * 0.6) + (over15_theoretical * 0.4);
  const over25_final = (goals_historical * 0.6) + (over25_theoretical * 0.4);
  const over35_final = (Math.max(0.05, goals_historical - 0.25) * 0.6) + (over35_theoretical * 0.4);
  
  return { over15: over15_final, over25: over25_final, over35: over35_final };
}

// 🎯 HELPER: Calculer la proba Poisson pour un seuil
function calculatePoissonThreshold(lambda, threshold) {
  let pUnder = 0;
  for (let i = 0; i <= Math.ceil(threshold); i++) {
    pUnder += pois(i, lambda);
  }
  return 1 - pUnder;
}

  const awayGA = awayStats.ga || away.ga || 1;
  const awayMatches = awayForm.length > 0 ? awayForm.length : (awayStats.matches || away.matches || 1);
  
  // 1️⃣ FORCES OFFENSIVES/DÉFENSIVES
  const homeOffense = homeGF / homeMatches;
  const homeDefense = homeGA / homeMatches;
  const awayOffense = awayGF / awayMatches;
  const awayDefense = awayGA / awayMatches;
  
  
  // 2️⃣ RATIO DE VICTOIRES
  const calcWinRate = (form) => {
    if(!form) return 0.5;
    const points = form.split('').reduce((s,c) => s + (c==='V'?3:c==='D'?1:0), 0);
    const maxPoints = form.length * 3;
    return maxPoints > 0 ? points / maxPoints : 0.5;
  };
  
  const homeWinRate = calcWinRate(homeForm);
  const awayWinRate = calcWinRate(awayForm);
  
  
  // 3️⃣ FORM MULTIPLIER AMÉLIORÉ
  const calcAdvancedFormMult = (form) => {
    if(!form || form.length === 0) return 1.0;
    let weightedPoints = 0;
    let totalWeight = 0;
    for(let i = 0; i < form.length; i++) {
      const weight = (form.length - i);
      const points = form[i]==='V' ? 3 : form[i]==='D' ? 1 : 0;
      weightedPoints += points * weight;
      totalWeight += 3 * weight;
    }
    const avgPercentage = weightedPoints / totalWeight;
    return 0.5 + avgPercentage;
  };
  
  const homeFormMult = calcAdvancedFormMult(homeForm);
  const awayFormMult = calcAdvancedFormMult(awayForm);
  
  
  // 4️⃣ ELO RATING - Pondération scientifiquement validée
  ELO_CACHE = {}; // ← VIDER LE CACHE pour recalculer!
  const homeElo = getElo(home.id, home.name, homeForm, homeGF, homeGA, homeMatches);
  const awayElo = getElo(away.id, away.name, awayForm, awayGF, awayGA, awayMatches);
  
  // Convertir Elo difference en multiplicateur (basé sur la formule d'Elo)
  const eloWinProb = getWinProbabilityFromElo(homeElo, awayElo);
  const homeEloMult = eloWinProb; // Entre 0 et 1
  const awayEloMult = 1 - eloWinProb;
  
  
  // 4️⃣.5️⃣ CALCUL SOS (Strength of Schedule) - Force des adversaires
  const sosHome = calculateSOS(home.id, home.name, homeLastMatches, competitionType);
  const sosAway = calculateSOS(away.id, away.name, awayLastMatches, competitionType);
  
  
  // 5️⃣ LAMBDAS POISSON FINALES avec ELO + SOS
  const homeAdvantage = compProps.homeAdvantage; // ✅ Utilise le type de compétition
  
  // ✅ CALCUL CORRECT DES LAMBDAS:
  // Base: homeOffense / awayDefense (ratio de force offensive/défensive)
  // Ajustement Elo: Multiplicateur basé sur l'avantage Elo (pas probabilité!)
  // Ajustement SOS: Diviseur basé sur force des adversaires
  // Ajustement FORME: Multiplicateur basé sur les 5 derniers matchs
  
  // Calcul du multiplicateur Elo: Si Elo favored 81%, le ratio est 0.811/0.189 = 4.3x
  // Mais on le limite à un multiplicateur raisonnable (1.1x à 1.3x)
  const eloMultiplier = Math.min(1.3, 1.0 + (eloWinProb - 0.5) * 0.6);  // Entre 0.7 et 1.3
  
  // Lambdas: (Offensive / Défensive adverse) * Multiplicateur Elo * Ajustement SOS * Forme récente
  let lambdaHome = (homeOffense / (awayDefense + 0.1)) * eloMultiplier * sosHome.sos / sosAway.sos * homeFormMult;
  let lambdaAway = (awayOffense / (homeDefense + 0.1)) * (1 / eloMultiplier) * sosAway.sos / sosHome.sos * awayFormMult;
  
  lambdaHome *= homeAdvantage;
  
  lambdaHome = clamp(lambdaHome, 0.3, 5.0);
  lambdaAway = clamp(lambdaAway, 0.3, 5.0);
  
  
  // 🎯 CALCULS BASÉS SUR L'ANALYSE RÉELLE (0% IMAGINATION, 100% DATA)
  
  // 1️⃣ RÉSULTAT 1N2 - ANALYSE FINE: 60% Historique + 40% Elo (Qualité adversaires)
  // MAIS pour Coupe du Monde: 30% Historique + 70% Elo (données moins fiables)
  const result1N2 = calculate1N2Advanced(bookmakerData, home.id, away.id, homeLastMatches, awayLastMatches, competitionType);
  const pH = result1N2.pH;
  const pD = result1N2.pD;
  const pA = result1N2.pA;
  
  // Home marque vs Away encaisse
  const homeGoalsExpected = bookmakerData.homeOffensiveVsAwayDefense;
  // Away marque vs Home encaisse
  const awayGoalsExpected = bookmakerData.awayOffensiveVsHomeDefense;
  const totalGoalsExpected = homeGoalsExpected + awayGoalsExpected;
  
  // 2️⃣ OVER/UNDER - FORMULE POISSON: Basée sur les lambdas réels (Attaque/Défense × Elo × SOS × Forme)
  const ouFine = calculateOverUnderPoisson(lambdaHome, lambdaAway);
  const ou15Home = { pOver: ouFine.ou15, pUnder: 1 - ouFine.ou15 };
  const ou15Away = { pOver: ouFine.ou15, pUnder: 1 - ouFine.ou15 };
  const ou25Home = { pOver: ouFine.ou25, pUnder: 1 - ouFine.ou25 };
  const ou25Away = { pOver: ouFine.ou25, pUnder: 1 - ouFine.ou25 };
  const ou35Home = { pOver: ouFine.ou35, pUnder: 1 - ouFine.ou35 };
  const ou35Away = { pOver: ouFine.ou35, pUnder: 1 - ouFine.ou35 };
  const ou15Total = { pOver: ouFine.ou15, pUnder: 1 - ouFine.ou15 };
  const ou25Total = { pOver: ouFine.ou25, pUnder: 1 - ouFine.ou25 };
  const ou35Total = { pOver: ouFine.ou35, pUnder: 1 - ouFine.ou35 };
  
  // 3️⃣ BTTS - FORMULE POISSON: P(Home ≥ 1) × P(Away ≥ 1)
  const bttsResult = calculateBTTSPoisson(lambdaHome, lambdaAway);
  const pBTTS = bttsResult.pBTTS;
  const pHomeScoresPoisson = bttsResult.pHomeScores;
  const pAwayScoresPoisson = bttsResult.pAwayScores;
  
  // 4️⃣ CLEAN SHEET - FORMULE POISSON: P(0 buts encaissés) = e^(-lambda_opponent)
  const csHome = calculateCleanSheetPoisson(lambdaAway);  // Home encaisse lambdaAway (attaque adversaire)
  const csAway = calculateCleanSheetPoisson(lambdaHome);  // Away encaisse lambdaHome (attaque adversaire)
  
  // 5️⃣ PROBABILITÉS DE MARQUAGE - FORMULE POISSON: P(équipe marque ≥ 1) = 1 - e^(-lambda)
  const pHomeScores = pHomeScoresPoisson;
  const pAwayScores = pAwayScoresPoisson;
  
  // 6️⃣ FORM RÉCENTE - Plus de poids aux résultats récents
  const homeFormMultiplier = bookmakerData.homeFormScore;  // Entre 0 et 1
  const awayFormMultiplier = bookmakerData.awayFormScore;
  
  // 🎯 CALCULER PROBABILITÉ POISSON FINALE (juste pour compatibilité)
  // Utiliser la distribution Poisson pour estimer P(Home > Away)
  const poissonWinProb = calculatePoissonWinProb(lambdaHome, lambdaAway);
  
  // 📊 IMPACTS EN POURCENTAGE
  const eloRawProb = eloWinProb * 100; // Prob Elo brut
  const sosImpact = ((sosHome.sos - 1) * 100) - ((sosAway.sos - 1) * 100); // Impact SOS
  const poissonImpact = (poissonWinProb * 100) - eloRawProb; // Impact Poisson
  const finalProb = poissonWinProb * 100;
  
  // 🎯 HT/FT DOUBLE - MONTE CARLO SIMULATION
  function calculateHTFTProbs(lH, lA) {
    const simulations = 100000;
    const htft = {'1/1':0,'1/N':0,'1/2':0,'N/1':0,'N/N':0,'N/2':0,'2/1':0,'2/N':0,'2/2':0};
    
    for (let s = 0; s < simulations; s++) {
      // SCORE HT (40% des buts)
      let homeHT = 0, awayHT = 0;
      let r = Math.random();
      for (let i = 0; i <= 10; i++) {
        if (r < pois(i, lH * 0.40)) { homeHT = i; break; }
        r -= pois(i, lH * 0.40);
      }
      r = Math.random();
      for (let i = 0; i <= 10; i++) {
        if (r < pois(i, lA * 0.40)) { awayHT = i; break; }
        r -= pois(i, lA * 0.40);
      }
      
      // RÉSULTAT HT
      let htResult = homeHT > awayHT ? '1' : homeHT === awayHT ? 'N' : '2';
      
      // MOMENTUM FACTOR: Ajuster λ pour 2e mi-temps
      let lH_2nd = lH * 0.60, lA_2nd = lA * 0.60;
      const scoreDiff = homeHT - awayHT;
      if (scoreDiff > 0) { // Home mène
        lH_2nd *= 1.15; lA_2nd *= 0.85;
      } else if (scoreDiff < 0) { // Away mène
        lA_2nd *= 1.15; lH_2nd *= 0.85;
      }
      
      // SCORE 2e MI-TEMPS (60% des buts)
      let home_2nd = 0, away_2nd = 0;
      r = Math.random();
      for (let i = 0; i <= 10; i++) {
        if (r < pois(i, lH_2nd)) { home_2nd = i; break; }
        r -= pois(i, lH_2nd);
      }
      r = Math.random();
      for (let i = 0; i <= 10; i++) {
        if (r < pois(i, lA_2nd)) { away_2nd = i; break; }
        r -= pois(i, lA_2nd);
      }
      
      // SCORE FINAL = HT + 2nd
      let homeFinal = homeHT + home_2nd;
      let awayFinal = awayHT + away_2nd;
      let ftResult = homeFinal > awayFinal ? '1' : homeFinal === awayFinal ? 'N' : '2';
      
      // ENREGISTRER HT/FT
      const key = htResult + '/' + ftResult;
      htft[key]++;
    }
    
    // CONVERTIR EN PROBABILITÉS
    for (let k in htft) htft[k] /= simulations;
    return htft;
  }
  
  const htftProbs = calculateHTFTProbs(lambdaHome, lambdaAway);
  
  

  // DOUBLE CHANCE
  const dcX1 = pH + pD;      // 1X (Home ou nul)
  const dc12 = pH + pA;      // 12 (pas de nul)
  const dcX2 = pD + pA;      // X2 (nul ou Away)
  
  
  // DRAW NO BET (DNB)
  const dnbHome = pH / (pH + pA);     // Home (remb. si nul)
  const dnbAway = pA / (pH + pA);     // Away (remb. si nul)
  
  
  // FIRST HALF WINNER (1ère mi-temps)
  // Pattern réel: 40% des buts en 1ère mi-temps, 60% en 2e mi-temps
  // (pas uniforme comme λ/2 supposerait)
  const lH_HT = lambdaHome * 0.40;
  const lA_HT = lambdaAway * 0.40;
  
  let pHT_1 = 0, pHT_D = 0, pHT_2 = 0;
  for (let i = 0; i <= 8; i++) {
    for (let j = 0; j <= 8; j++) {
      const p = pois(i, lH_HT) * pois(j, lA_HT);
      if (i > j) pHT_1 += p;
      else if (i === j) pHT_D += p;
      else pHT_2 += p;
    }
  }
  
  // 🔍 DEBUG
  console.log(`🔍 DEBUG calculateAdvancedProbabilities:`);
  console.log(`   homeFormMult=${r2(homeFormMult)}, awayFormMult=${r2(awayFormMult)}`);
  console.log(`   pH=${r2(pH)}, pD=${r2(pD)}, pA=${r2(pA)}`);
  console.log(`   lambdaHome=${r2(lambdaHome)}, lambdaAway=${r2(lambdaAway)}`);
  
  return { 
    lambdaHome, lambdaAway, homeFormMult, awayFormMult,
    // 📊 DONNÉES MARCHÉ 1N2
    pH, pD, pA,
    homeElo, awayElo, eloWinProb,
    sosHome: sosHome.sos, sosAway: sosAway.sos,
    homeLastMatches, awayLastMatches,
    homeOffense, homeDefense, awayOffense, awayDefense,
    homeGF, homeGA, awayGF, awayGA,
    eloRawProb, eloMultiplier, sosImpact, poissonImpact, finalProb,
    competitionType, compProps,
    // 📊 DONNÉES MARCHÉ BTTS
    pHomeScores, pAwayScores, pBTTS,
    // 📊 DONNÉES MARCHÉ OVER/UNDER (garder les objets {pOver, pUnder})
    ou15Home, ou15Away, ou15Total,
    ou25Home, ou25Away, ou25Total,
    ou35Home, ou35Away, ou35Total,
    // 📊 DONNÉES MARCHÉ DOUBLE CHANCE
    dcX1, dc12, dcX2,
    // 📊 DONNÉES MARCHÉ DRAW NO BET
    dnbHome, dnbAway,
    // 📊 DONNÉES MARCHÉ CLEAN SHEET
    csHome, csAway,
    // 📊 DONNÉES MARCHÉ FIRST HALF
    pHT_1, pHT_D, pHT_2,
    // 📊 DONNÉES MARCHÉ HT/FT DOUBLE
    HTFT: htftProbs
  };
}

    };
    
    return {

async function getH2HHistory(homeId, awayId) {

    let homeWins = 0, draws = 0, awayWins = 0;
    let homeGF = 0, homeGA = 0;
    
    matches.forEach(m => {
      const hg = m.goals?.home || 0;
      const ag = m.goals?.away || 0;
      homeGF += hg;
      homeGA += ag;
      
      if (hg > ag) homeWins++;
      else if (hg < ag) awayWins++;
      else draws++;
    });
    
    return {
      totalMatches: matches.length,
      homeWins,
      draws,
      awayWins,
      homeGF,
      homeGA,
      homeAvgGoals: matches.length > 0 ? homeGF / matches.length : 0,
      awayAvgGoals: matches.length > 0 ? homeGA / matches.length : 0,
    };
  } catch(e) {
    console.warn('Erreur getH2HHistory:', e);
    return null;
  }
}

// 🎯 Calculer probabilité Poisson(home > away)
function calculatePoissonWinProb(lambdaHome, lambdaAway) {
  // Approximation: utiliser la distribution Poisson
  // P(Home gagne) ≈ somme pour i=1 à ∞ de P(Poisson(lambdaHome) = i) × P(Poisson(lambdaAway) < i)
  // Simplification: simulation rapide sur 20 buts max
  
  let prob = 0;
  for (let homeGoals = 1; homeGoals <= 20; homeGoals++) {
    // P(Home marque exactement homeGoals)
    const pHome = poissonProb(lambdaHome, homeGoals);
    
    // P(Away marque moins que homeGoals)
    let pAwayLess = 0;
    for (let awayGoals = 0; awayGoals < homeGoals; awayGoals++) {
      pAwayLess += poissonProb(lambdaAway, awayGoals);
    }
    
    prob += pHome * pAwayLess;
  }
  
  return prob;
}

// Probabilité Poisson P(X = k) avec paramètre lambda
function poissonProb(lambda, k) {
  const numerator = Math.pow(lambda, k) * Math.exp(-lambda);
  let denominator = 1;
  for (let i = 1; i <= k; i++) {
    denominator *= i;
  }
  return numerator / denominator;
}

function buildModel(home,away,homeForm,awayForm,rng,leagueKey='l1'){
  try {
    // 🎯 UTILISER LE MODÈLE AVANCÉ POUR CALCULER LES LAMBDAS
    const advanced = calculateAdvancedProbabilities(home, away, homeForm, awayForm, leagueKey);
    if (!advanced) {
      console.error('❌ calculateAdvancedProbabilities retourné undefined!');
      return null;
    }
    let lH = advanced.lambdaHome;
    let lA = advanced.lambdaAway;
    const formMultH = advanced.homeFormMult;
    const formMultA = advanced.awayFormMult;
    
  
  const CAP = 7;
  const FM = Array.from({length:13}, () => new Array(13).fill(0));
  const HT = {1:0, N:0, 2:0};
  // 🎯 HTFT - Utiliser la simulation Monte Carlo (avec momentum)
  const HTFT = advanced.HTFT || {};
  
  // 🎯 REMPLIR LA MATRICE FM (Poisson 2D pour les scores finaux)
  const l1H = lH * 0.40, l2H = lH * 0.60;
  const l1A = lA * 0.40, l2A = lA * 0.60;
  
  for(let h1=0; h1<CAP; h1++) {
    for(let a1=0; a1<CAP; a1++) {
      for(let h2=0; h2<CAP; h2++) {
        for(let a2=0; a2<CAP; a2++) {
          const p = pois(h1,l1H) * pois(a1,l1A) * pois(h2,l2H) * pois(a2,l2A);
          if(p < 1e-9) continue;
          const fh = h1 + h2, fa = a1 + a2;
          FM[fh][fa] += p;
          const htK = h1 > a1 ? '1' : h1 < a1 ? '2' : 'N';
          HT[htK==='1'?1:htK==='2'?2:'N'] += p;
        }
      }
    }
  }
  
  // 🎯 UTILISER LES VALEURS FINES DE calculateAdvancedProbabilities AU LIEU DE RECALCULER
  // (plutôt que de recalculer naïvement à partir de FM)
  const pH = advanced.pH;
  const pA = advanced.pA;
  const pD = advanced.pD;
  
  // 🔍 DEBUG - VÉRIFIE LES VALEURS REÇUES DE calculateAdvancedProbabilities
  console.log(`🔍 DEBUG buildModel reçoit:`);
  console.log(`   pH=${r2(pH)}, pD=${r2(pD)}, pA=${r2(pA)} (total=${r2(pH+pD+pA)})`);
  console.log(`   formMultH=${r2(formMultH)}, formMultA=${r2(formMultA)}`);
  console.log(`   lambdaHome=${r2(lH)}, lambdaAway=${r2(lA)}`);
  const btts = advanced.pBTTS;
  const cs_h = advanced.csHome;
  const cs_a = advanced.csAway;
  
  // Over/Under - extraire les pOver des objets
  const over = {
    0.5: Math.min(1, (advanced.ou15Total?.pOver || 0.5) * 1.2),  // Approximation
    1.5: advanced.ou15Total?.pOver || 0.5,
    2.5: advanced.ou25Total?.pOver || 0.5,
    3.5: advanced.ou35Total?.pOver || 0.5,
    4.5: Math.max(0.05, (advanced.ou35Total?.pOver || 0.5) * 0.6)  // Approximation
  };
  
  const hOver = {
    1.5: advanced.ou15Home?.pOver || 0.5
  };
  
  const aOver = {
    1.5: advanced.ou15Away?.pOver || 0.5
  };
  
  return {
    lH: r2(lH), lA: r2(lA), FM, HT, HTFT, pH, pD, pA, btts, cs_h, cs_a, over, hOver, aOver, formMultH, formMultA, rng,
    // 📊 DONNÉES DU MODÈLE POUR L'ANALYSE DÉTAILLÉE - 1N2
    homeElo: advanced.homeElo,
    awayElo: advanced.awayElo,
    eloWinProb: advanced.eloWinProb,
    sosHome: advanced.sosHome,
    sosAway: advanced.sosAway,
    lambdaHome: advanced.lambdaHome,
    lambdaAway: advanced.lambdaAway,
    eloRawProb: advanced.eloRawProb,
    sosImpact: advanced.sosImpact,
    poissonImpact: advanced.poissonImpact,
    finalProb: advanced.finalProb,
    // 📊 DONNÉES MARCHÉ BTTS
    pHomeScores: advanced.pHomeScores,
    pAwayScores: advanced.pAwayScores,
    pBTTS: advanced.pBTTS,
    // 📊 DONNÉES MARCHÉ OVER/UNDER (3 seuils)
    ou15Home: advanced.ou15Home,
    ou15Away: advanced.ou15Away,
    ou15Total: advanced.ou15Total,
    ou25Home: advanced.ou25Home,
    ou25Away: advanced.ou25Away,
    ou25Total: advanced.ou25Total,
    ou35Home: advanced.ou35Home,
    ou35Away: advanced.ou35Away,
    ou35Total: advanced.ou35Total,
    // 📊 DONNÉES MARCHÉ CLEAN SHEET
    csHome: advanced.csHome,
    csAway: advanced.csAway,
    // 📊 DONNÉES MARCHÉ DOUBLE CHANCE
    dcX1: advanced.dcX1,
    dc12: advanced.dc12,
    dcX2: advanced.dcX2,
    // 📊 DONNÉES MARCHÉ DRAW NO BET
    dnbHome: advanced.dnbHome,
    dnbAway: advanced.dnbAway,
    // 📊 DONNÉES MARCHÉ FIRST HALF
    pHT_1: advanced.pHT_1,
    pHT_D: advanced.pHT_D,
    pHT_2: advanced.pHT_2
  };
  } catch(err) {
    console.error('❌ ERREUR dans buildModel:', err);
    return null;
  }
}

function buildStats(team, form, kind){
  // Essayer d'utiliser les vraies stats de l'API (10 derniers matchs)
  const realStats = FOOTBALL_API.getTeamStats(team.id);
  
  if (realStats && realStats.totalMatches > 0) {
    
    // ✅ UTILISER LA VRAIE FORME DE L'API, pas celle générée!
    const trueForm = realStats.form || form;
    
    const matches = 10; // On utilise 10 matchs
    const gf = realStats.gf || 1;
    const ga = realStats.ga || 1;
    const wins = realStats.wins || 0;
    const draws = realStats.draws || 0;
    const losses = realStats.losses || 0;
    
    // Calculer clean sheets et BTTS depuis les matchs réels
    // Approximation: CS = matches où on n'a pas encaissé
    const cs = Math.round((ga === 0) ? matches : (matches * (1 - ga/matches/2.5)));
    const bttsPct = (gf > 0 && ga > 0) ? 0.5 : 0.2;
    
    const rankGen = Math.max(1, Math.min(18, Math.round(10 - (gf/matches)/2.2 * 12)));
    const rankSide = Math.max(1, Math.min(18, rankGen + (kind === 'home' ? -1 : 1)));
    
    return {
      played: matches,
      wins, draws, losses,
      gf, ga, gd: gf - ga,
      rankGen, rankSide,
      cs: Math.max(0, cs),
      bttsPct: clamp(bttsPct, 0, 1),
      form: trueForm.split(''), // ✅ VRAIE FORME!
      series: trueForm ? trueForm.match(/(.)\1*/g).map(s => s.charAt(0) + s.length).join(' ') : '',
      avgFor: r2(gf / matches),
      avgAga: r2(ga / matches),
    };
  }
  
  // Fallback: calculer à partir des stats du standing (ancienne méthode)
  const matches = team.matches || 34;
  const gf = team.gf, ga = team.ga;
  const strength = (gf / matches) / 2.2;
  
  let wins = 0, draws = 0, losses = 0;
  const w_rate = strength * 0.65 + 0.15;
  wins = Math.round(matches * w_rate);
  const d_rate = 0.25 * (1 - strength);
  draws = Math.round(matches * d_rate);
  losses = matches - wins - draws;
  
  const rankGen = Math.max(1, Math.min(18, Math.round(10 - strength * 12)));
  const rankSide = Math.max(1, Math.min(18, rankGen + (kind === 'home' ? -1 : 1)));
  
  const cs = Math.round((1 - ga/matches/2.2) * matches * 0.3);
  const bttsPct = (gf/matches/2.2) * 0.6;
  
  return {
    played: matches,
    wins, draws, losses,
    gf, ga, gd: gf - ga,
    rankGen, rankSide,
    cs, bttsPct,
    form: form ? form.split('') : ['N','N','N','N','N'],
    series: form ? form.match(/(.)\1*/g).map(s => s.charAt(0) + s.length).join(' ') : '',
    avgFor: r2(gf / matches),
    avgAga: r2(ga / matches),
  };
}

    const sorted = matches

  }

    });
  }
  return out;
}

/* ---------- confidence calculator (Kelly-based) ---------- */
function calcConfidence(m,marketName,sel,model,h2h,statsH,statsA){
  // PRIMARY SIGNAL: Kelly Criterion (% of bankroll to wager)
  const kelly=((sel.cote-1)*sel.est-(1-sel.est))/(sel.cote-1);
  let conf=5;
  
  // Kelly to confidence baseline (1-10)
  if(kelly<-0.05)conf=1; // NO-BET (loss > 5%)
  else if(kelly<0)conf=2; // negative EV
  else if(kelly<0.01)conf=3; // quasi-neutral (0-1%)
  else if(kelly<0.02)conf=4; // very weak (1-2%)
  else if(kelly<0.05)conf=5; // weak (2-5%)
  else if(kelly<0.10)conf=6; // medium (5-10%)
  else if(kelly<0.15)conf=7; // good (10-15%)
  else if(kelly<0.20)conf=8; // very good (15-20%)
  else conf=9; // excellent (>20%)
  
  // SECONDARY SIGNALS: context adjustments (max ±1.5)
  const isFav=sel.est>0.5;
  const stats=isFav?statsH:statsA;
  
  // Form: reinforce if positive EV + good form
  const wins=stats.form.filter(x=>x==='W').length;
  if(wins>=3&&kelly>0)conf+=1;
  const losses=stats.form.filter(x=>x==='L').length;
  if(losses>=2&&kelly<0.02)conf-=1;
  
  // H2H: favour for strong h2h advantage + positive value
  const h2hWins=h2h.filter(h=>isFav?h.hg>h.ag:h.ag>h.hg).length;
  if(h2hWins>=4&&kelly>0.05)conf+=0.5;
  if(h2hWins===0&&kelly>0.02)conf-=0.5;
  
  // Certainty: extreme probs (>65%/<35%) amplify or reduce
  const certainty=Math.abs(sel.est-0.5);
  if(certainty>0.35){
    if(kelly>0.05)conf+=1; // clear + valuable
    if(kelly<0)conf-=1; // clear but losing
  }
  
  return clamp(Math.round(conf*10)/10,1,10);
}

  const factors=[];

  else factors.push({label:'Exceptionnel (Kelly >20%)',val:'+'+((kelly)*100).toFixed(1)+'%',color:'green'});
  
  // SECONDARY: context boosters/reducers
  const wins=stats.form.filter(x=>x==='W').length;
  if(wins>=3&&kelly>0)factors.push({label:'Bonne forme + value positive',val:'+1.0',color:'green'});
  const losses=stats.form.filter(x=>x==='L').length;
  if(losses>=2&&kelly<0.02)factors.push({label:'Mauvaise forme + faible value',val:'-1.0',color:'red'});
  
  const h2hWins=h2h.filter(h=>isFav?h.hg>h.ag:h.ag>h.hg).length;
  if(h2hWins>=4&&kelly>0.05)factors.push({label:'Dominance H2H ('+h2hWins+'/5) + value',val:'+0.5',color:'green'});
  if(h2hWins===0&&kelly>0.02)factors.push({label:'Aucune victoire H2H',val:'-0.5',color:'red'});
  
  const certainty=Math.abs(sel.est-0.5);
  if(certainty>0.35){
    if(kelly>0.05)factors.push({label:'Pronostic très clair + rentable',val:'+1.0',color:'green'});
    if(kelly<0)factors.push({label:'Pronostic clair mais perdant',val:'-1.0',color:'red'});
  }
  
  if(!factors.length)factors.push({label:'Pari neutre',val:'~5/10',color:'gray'});
  return factors;
}

function mkSel(label, est, rng, opt, marketId) {
  opt = opt || {};
  if(est == null || (opt.allowGray && rng() < opt.grayChance)) {
    return {sel: label, cote: null, implied: null, est: null, value: null, kelly: null, color: 'gray', marketId};
  }
  est = clamp(est, 0.005, 0.985);
  
  // ✅ PRIORITÉ: Utiliser la VRAIE cote de l'API si disponible
  // ❌ SINON: Générer une cote fictive (fallback)
  let cote = opt.realCote ? opt.realCote : (() => {
    const margin = opt.fixedMargin != null ? opt.fixedMargin : (-0.09 + rng() * 0.21);
    return r2(1 / (est * (1 + margin)));
  })();
  
  cote = Math.max(1.02, cote);
  const implied = 1 / cote;
  const value = est * cote - 1;
  const kelly = ((cote - 1) * est - (1 - est)) / (cote - 1);
  
  return {
    sel: label,
    cote,
    implied,
    est,
    value,
    kelly,
    color: voyantColor(value, est),
    marketId,
    realCote: opt.realCote || null,
    bookmaker: opt.bookmaker || null  // ✅ Ajouter le bookmaker
  };
}
// 🎯 CALCUL BTTS - Both Teams To Score
function calculateBTTS(lambdaHome, lambdaAway) {
  const pHomeScores = 1 - Math.exp(-lambdaHome);
  const pAwayScores = 1 - Math.exp(-lambdaAway);
  const pBTTS = pHomeScores * pAwayScores;
  return pBTTS;
}

// 🎯 CALCUL OVER/UNDER 2.5
function calculateOverUnder(lambdaHome, lambdaAway, threshold = 2.5) {
  let pUnder = 0;
  for (let i = 0; i <= threshold; i++) {
    for (let j = 0; j <= threshold - i; j++) {
      pUnder += poissonProb(lambdaHome, i) * poissonProb(lambdaAway, j);
    }
  }
  const pOver = 1 - pUnder;
  return { pUnder, pOver };
}

// 🎯 CALCUL CLEAN SHEET
function calculateCleanSheet(lambdaDefense) {
  const pClean = Math.exp(-lambdaDefense);
  return pClean;
}

const FOOTBALL_API = {
  BASE: 'https://foot-value-bet.vercel.app/api/proxy',
  LEAGUES: {
    'l1': { id: 61, name: 'Ligue 1' },

  },
  cache: { standings: {}, matches: {}, teamStats: {} },

  getApiKey() { return state?.settings?.apiKey || ''; },
  isCacheValid(t, h) { return t && Date.now() - t < h * 60 * 60 * 1000; },

  async fetchStandings(leagueKey) {
    const apiKey = this.getApiKey();
    if (!apiKey) throw new Error('Cle API non configuree');
    const leagueId = this.LEAGUES[leagueKey]?.id;
    if (!leagueId) throw new Error('Ligue inconnue: ' + leagueKey);
    
    if (this.cache.standings[leagueKey]?.data && this.isCacheValid(this.cache.standings[leagueKey].timestamp, 24)) {
      return this.cache.standings[leagueKey].data;
    }
    
    const season = (leagueKey === 'wc') ? '2026' : '2024'; const url = this.BASE + '?endpoint=standings&league=' + leagueId + '&season=' + season;
    
    const res = await fetch(url, {
      headers: {
        'x-apisports-key': apiKey
      }
    });
    
    
    if (!res.ok) {
      const text = await res.text();
      console.error('Error response:', text);
      if (res.status === 403) throw new Error('Cle API invalide ou limite atteinte (403)');
      if (res.status === 429) throw new Error('Trop de requetes - attends quelques minutes (429)');
      if (res.status === 500) throw new Error('Serveur indisponible (500)');
      throw new Error('HTTP ' + res.status + ': ' + res.statusText);
    }
    
    const json = await res.json();
    
    const standings = json.response[0].league.standings[0];
    const data = {
      teams: standings.map(row => ({
        id: row.team.id.toString(),
        name: row.team.name,
        short: row.team.name.substring(0,3).toUpperCase(),
        gf: row.all.goals.for,
        ga: row.all.goals.against,
        played: row.all.played,
        form: row.form ? row.form.split('') : [],
      })),
    };
    
    this.cache.standings[leagueKey] = { data, timestamp: Date.now() };
    return data;
  },

    if (!apiKey) throw new Error('API key missing');

    const cacheKey = leagueKey + '_' + (dateStr || 'all');

      */

  async fetchTeamStats(teamId, season) {
    const apiKey = this.getApiKey();
    if (!apiKey) throw new Error('Cle API non configuree');
    
    try {
      // Récupérer les matchs de qualification + Coupe du Monde
      // Plage: 2023-01-01 à 2026-06-30 (couvre toutes les confédérations + WC)
      const url = this.BASE + '?endpoint=fixtures&team=' + teamId + 
        '&from=2023-01-01&to=2026-06-30';
      
      const res = await fetch(url, {
        headers: {
          'x-apisports-key': apiKey
        }
      });
      
      if (!res.ok) throw new Error('HTTP ' + res.status);
      
      const json = await res.json();
      const matches = json.response || [];
      
      
      if (matches.length === 0) {
        console.warn('⚠️ ZÉRO match pour team', teamId, '- Parameters:', json.parameters);
        return { wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, form: 'NNNNN', totalMatches: 0 };
      }
      
      // ✅ FILTRER: Garder seulement les matchs avec résultats (pas null-null)
      const matchesWithResults = matches.filter(m => 
        m.goals.home !== null && m.goals.away !== null
      );
      
      if (matchesWithResults.length === 0) {
        console.warn('⚠️ ZÉRO match avec résultats pour team', teamId);
        return { wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, form: 'NNNNN', totalMatches: 0 };
      }
      
      // Trier les matchs par date (ancien → récent)
      const sortedByDate = matchesWithResults.sort((a, b) => 
        new Date(a.fixture.date) - new Date(b.fixture.date)
      );
      
      // Calculer les stats sur les 10 DERNIERS matchs
      const last10 = sortedByDate.slice(-10); // Les 10 derniers matchs
      const last5 = last10.slice(-5); // Les 5 derniers PARMI les 10
      
      // Calculer les stats
      let wins = 0, draws = 0, losses = 0, gf = 0, ga = 0;
      let form = '';
      
      // Calculer les stats sur les 10 derniers matchs
      last10.forEach(m => {
        const isHome = m.teams.home.id == teamId;
        const myGoals = isHome ? m.goals.home : m.goals.away;
        const oppGoals = isHome ? m.goals.away : m.goals.home;
        
        gf += myGoals;
        ga += oppGoals;
        
        if (myGoals > oppGoals) {
          wins++;
        } else if (myGoals === oppGoals) {
          draws++;
        } else {
          losses++;
        }
      });
      
      // DEBUG: Afficher les 10 derniers matchs
      last10.forEach((m, idx) => {
        const isHome = m.teams.home.id == teamId;
        const myGoals = isHome ? m.goals.home : m.goals.away;
        const oppGoals = isHome ? m.goals.away : m.goals.home;
        const result = myGoals > oppGoals ? '✓V' : myGoals < oppGoals ? '✗L' : 'D';
        const matchDisplay = isHome 
          ? `${m.teams.home.name} ${myGoals}-${oppGoals} ${m.teams.away.name}`
          : `${m.teams.away.name} ${myGoals}-${oppGoals} ${m.teams.home.name}`;
        const marker = idx >= 5 ? '→ ' : '  '; // Marquer les 5 derniers
      });
      
      // Calculer la FORM sur les 10 derniers (pour calculs précis)
      form = '';
      last10.forEach(m => {
        const isHome = m.teams.home.id == teamId;
        const myGoals = isHome ? m.goals.home : m.goals.away;
        const oppGoals = isHome ? m.goals.away : m.goals.home;
        
        if (myGoals > oppGoals) {
          form = form + 'V';
        } else if (myGoals === oppGoals) {
          form = form + 'D';
        } else {
          form = form + 'L';
        }
      });
      
      return { wins, draws, losses, gf, ga, form, totalMatches: matches.length, lastMatches: last10 };
      
    } catch (err) {
      console.error('❌ Error fetching team stats:', err);
      return null;
    }
  },

  async waitForTeamStats(teamIds = [], maxWaitMs = 5000) {
    const startTime = Date.now();
    
    while (Date.now() - startTime < maxWaitMs) {
      const allLoaded = teamIds.every(id => this.cache.teamStats[id]);
      if (allLoaded) {
        return true;
      }
      await new Promise(r => setTimeout(r, 100)); // Attendre 100ms avant de revérifier
    }
    
    console.warn('⏱️ Timeout: Stats non complètement chargées après', maxWaitMs, 'ms');
    return false;
  },

  async fetchStatsForTeams(teamIds = []) {
    if (!teamIds?.length) return;
    
    try {
      
      for (const teamId of teamIds) {
        if (this.cache.teamStats[teamId]) {
          continue;
        }
        
        const stats = await this.fetchTeamStats(teamId);
        if (stats) {
          this.cache.teamStats[teamId] = {
            ...stats,
            timestamp: Date.now()
          };
        } else {
          console.warn(`⚠️ Pas de stats pour team ${teamId}`);
        }
      }
    } catch (err) {
      console.error('Erreur chargement stats équipes:', err);
    }
  },

  async loadTeamsStats(leagueKey) {
    try {
      const league = this.LEAGUES[leagueKey];
      if (!league) return;
      
      
      // Récupérer d'abord les standings pour avoir les équipes
      const standings = await this.fetchStandings(leagueKey);
      if (!standings?.teams) return;
      
      const season = (leagueKey === 'wc') ? '2026' : '2024';
      
      // Charger les stats pour chaque équipe
      for (const team of standings.teams) {
        if (this.cache.teamStats[team.id]) continue;
        
        const stats = await this.fetchTeamStats(team.id, season);
        if (stats) {
          this.cache.teamStats[team.id] = {
            ...stats,
            teamName: team.name,
            timestamp: Date.now()
          };
        }
      }
      
    } catch (err) {
      console.error('Erreur chargement stats:', err);
    }
  },

  getTeamStats(teamId) {
    return this.cache.teamStats[teamId] || null;
  },

  getTeamData(teamName, leagueKey) {
    const cached = this.cache.standings[leagueKey];
    return cached?.data?.teams?.find(t => t.name === teamName) || null;
  },
};

/* ---------- assemble full match data (cached) ---------- */
let matchCache={};

function getMatchData(id){
  if(matchCache[id])return matchCache[id];
  const m=MATCHES.find(x=>x.id===id);
  
  // Create deterministic RNG based on match ID
  const seed = hashStr(m.id + m.home.id + m.away.id);
  const rng = mulberry32(seed);
  
  // Generate form from REAL stats via cache
  const calcForm = (team) => {
    // ✅ PRIORITÉ: Essayer d'obtenir les VRAIES stats du cache API
    const realStats = FOOTBALL_API.getTeamStats(team.id);
    if (realStats && realStats.form) {
      return realStats.form;
    }
    
    // Fallback: générer à partir des stats du standings
    const matches = team.matches || 34;
    const gf = team.gf || 0, ga = team.ga || 0;
    const avgGoals = matches > 0 ? gf / matches : 0;
    const strength = avgGoals / 2.2; // 2.2 is average
    
    let form = '';
    for(let i = 0; i < 5; i++) {
      const r = Math.random();
      if(r < 0.30 + strength * 0.3) form += 'V';
      else if(r < 0.55 + strength * 0.25) form += 'D';
      else form += 'L';
    }
    return form;
  };
  
  const homeForm = calcForm(m.home);
  const awayForm = calcForm(m.away);
  
  const model = buildModel(m.home, m.away, homeForm, awayForm, rng, m.lg);
  const data = {
    meta: m,
    model,
    homeForm,
    awayForm,
    statsH: buildStats(m.home, homeForm, 'home'),
    statsA: buildStats(m.away, awayForm, 'away'),
    h2h: buildH2H(m),
    markets: buildMarkets(m, model),
  };
  
  matchCache[id] = data;
  return data;
}

function viewAnalytics(){
  const allBets=[...state.bets,...state.history];
  const closedBets=state.history;
  
  // KPIs
  const totalProfit=closedBets.reduce((s,b)=>{
    if(b.status==='gagne')return s+b.stake*(b.cote-1);
    if(b.status==='perdu')return s-b.stake;
    return s;
  },0);
  const totalStaked=closedBets.reduce((s,b)=>s+b.stake,0);
  const roi=totalStaked>0?(totalProfit/totalStaked*100):0;
  const wonCount=closedBets.filter(b=>b.status==='gagne').length;
  const lostCount=closedBets.filter(b=>b.status==='perdu').length;
  const winRate=closedBets.length>0?(wonCount/closedBets.length*100):0;
  
  // Best/Worst
  let best=null,worst=null;
  closedBets.forEach(b=>{
    const profit=b.status==='gagne'?b.stake*(b.cote-1):(b.status==='perdu'?-b.stake:0);
    if(!best||profit>best.profit)best={...b,profit};
    if(!worst||profit<worst.profit)worst={...b,profit};
  });
  
  // By Confidence
  const byConf={};
  closedBets.forEach(b=>{
    const conf=Math.floor(b.conf);
    if(!byConf[conf])byConf[conf]={won:0,lost:0,cancelled:0};
    if(b.status==='gagne')byConf[conf].won++;
    else if(b.status==='perdu')byConf[conf].lost++;
    else byConf[conf].cancelled++;
  });
  
  // By Market
  const byMarket={};
  closedBets.forEach(b=>{
    if(!byMarket[b.market])byMarket[b.market]={won:0,lost:0,total:0,profit:0};
    byMarket[b.market].total++;
    if(b.status==='gagne'){
      byMarket[b.market].won++;
      byMarket[b.market].profit+=b.stake*(b.cote-1);
    }else if(b.status==='perdu'){
      byMarket[b.market].lost++;
      byMarket[b.market].profit-=b.stake;
    }
  });
  
  return `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px">
    <div class="card" style="padding:16px">
      <div style="font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;margin-bottom:8px">Profit total</div>
      <div style="font-size:26px;font-weight:800;color:${totalProfit>=0?'var(--success)':'var(--error)'}">
        ${totalProfit>=0?'+':''}${totalProfit.toFixed(2)} €
      </div>
      <div style="font-size:12px;color:var(--txt3);margin-top:6px">
        ${closedBets.length} paris clôturés
      </div>
    </div>
    
    <div class="card" style="padding:16px">
      <div style="font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;margin-bottom:8px">ROI</div>
      <div style="font-size:26px;font-weight:800;color:${roi>=0?'var(--success)':'var(--error)'}">
        ${roi>=0?'+':''}${roi.toFixed(1)}%
      </div>
      <div style="font-size:12px;color:var(--txt3);margin-top:6px">
        Engagé: ${totalStaked.toFixed(2)} €
      </div>
    </div>
    
    <div class="card" style="padding:16px">
      <div style="font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;margin-bottom:8px">Taux de réussite</div>
      <div style="font-size:26px;font-weight:800;color:var(--accent)">
        ${winRate.toFixed(1)}%
      </div>
      <div style="font-size:12px;color:var(--txt3);margin-top:6px">
        ${wonCount} gagnés / ${lostCount} perdus
      </div>
    </div>
    
    <div class="card" style="padding:16px">
      <div style="font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;margin-bottom:8px">Bankroll</div>
      <div style="font-size:26px;font-weight:800;color:var(--accent)">
        ${(state.settings.bankroll+totalProfit).toFixed(0)} €
      </div>
      <div style="font-size:12px;color:var(--txt3);margin-top:6px">
        Départ: ${state.settings.bankroll} €
      </div>
    </div>
  </div>
  
  ${best?`
  <div class="card" style="padding:16px;margin-bottom:14px">
    <h3 style="font-weight:800;margin-bottom:10px;font-size:14px">🏆 Meilleur pari</h3>
    <div style="background:var(--bg2);border-left:4px solid var(--success);border-radius:8px;padding:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div>
          <div style="font-weight:700;font-size:13px">${best.matchName}</div>
          <div style="font-size:12px;color:var(--txt3)">${best.market} → ${best.sel}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:18px;font-weight:800;color:var(--success)">+${best.profit.toFixed(2)} €</div>
          <div style="font-size:11px;color:var(--txt3)">@ ${best.cote.toFixed(2)}</div>
        </div>
      </div>
    </div>
  </div>
  `:''}
  
  ${worst?`
  <div class="card" style="padding:16px;margin-bottom:14px">
    <h3 style="font-weight:800;margin-bottom:10px;font-size:14px">💔 Pire pari</h3>
    <div style="background:var(--bg2);border-left:4px solid var(--error);border-radius:8px;padding:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div>
          <div style="font-weight:700;font-size:13px">${worst.matchName}</div>
          <div style="font-size:12px;color:var(--txt3)">${worst.market} → ${worst.sel}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:18px;font-weight:800;color:var(--error)">${worst.profit.toFixed(2)} €</div>
          <div style="font-size:11px;color:var(--txt3)">@ ${worst.cote.toFixed(2)}</div>
        </div>
      </div>
    </div>
  </div>
  `:''}
  
  <div class="card" style="padding:16px;margin-bottom:14px">
    <h3 style="font-weight:800;margin-bottom:12px;font-size:14px">📊 Taux réussite par confiance</h3>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${Object.keys(byConf).sort((a,b)=>b-a).map(conf=>{
        const d=byConf[conf];
        const total=d.won+d.lost;
        const wr=total>0?(d.won/total*100):0;
        return `
          <div style="display:flex;align-items:center;gap:10px">
            <div style="min-width:50px;font-weight:700;color:var(--accent)">${conf}/10</div>
            <div style="flex:1;background:var(--bg2);border-radius:8px;height:24px;overflow:hidden;position:relative">
              <div style="height:100%;background:var(--success);width:${wr}%;transition:width 0.3s"></div>
              <div style="position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--txt)">${wr.toFixed(0)}%</div>
            </div>
            <div style="min-width:80px;text-align:right;font-size:12px;color:var(--txt3)">
              ${d.won}W / ${d.lost}L
            </div>
          </div>
        `;
      }).join('')}
    </div>
  </div>
  
  <div class="card" style="padding:16px">
    <h3 style="font-weight:800;margin-bottom:12px;font-size:14px">📈 Performance par marché</h3>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${Object.entries(byMarket).sort((a,b)=>Math.abs(b[1].profit)-Math.abs(a[1].profit)).map(([market,d])=>{
        const wr=d.total>0?(d.won/d.total*100):0;
        return `
          <div style="background:var(--bg2);border-radius:10px;padding:12px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
              <div style="font-weight:700;font-size:13px">${market}</div>
              <div style="font-size:14px;font-weight:800;color:${d.profit>=0?'var(--success)':'var(--error)'}">
                ${d.profit>=0?'+':''}€${Math.abs(d.profit).toFixed(1)}
