<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Foot Value Bet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--bg2:#0e1420;--panel:#131b2a;--panel2:#172033;--panel3:#1d2a40;--line:#243149;--line2:#2e3e5c;--txt:#eef3fb;--txt2:#a8b6cf;--txt3:#6f7e9b;--accent:#c6ff3d;--accent2:#7cf2c8;--blue:#3b82f6;--green:#27d17c;--green-bg:rgba(39,209,124,.14);--yellow:#f0c640;--yellow-bg:rgba(240,198,64,.14);--red:#f0556b;--red-bg:rgba(240,85,107,.13);--gray:#5d6b86;--gray-bg:rgba(93,107,134,.16);--radius:16px;--mono:'JetBrains Mono',ui-monospace,monospace;--disp:'Bricolage Grotesque',sans-serif;--body:'Instrument Sans',-apple-system,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);background:radial-gradient(1100px 600px at 85% -10%,rgba(124,242,200,.06),transparent 60%),radial-gradient(900px 500px at -5% 10%,rgba(59,130,246,.07),transparent 55%),var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;}
::selection{background:var(--accent);color:#0a0e14}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:20px;border:2px solid var(--bg)}
.app{display:flex;min-height:100vh}
.sidebar{width:248px;flex-shrink:0;position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px;gap:6px;z-index:40;}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 20px}
.brand-logo{width:42px;height:42px;border-radius:13px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#08210f;font-weight:800;font-size:22px;box-shadow:0 6px 22px rgba(198,255,61,.28);position:relative;overflow:hidden;}
.brand-logo::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.6),transparent 50%)}
.brand-name{font-family:var(--disp);font-weight:800;font-size:18px;line-height:1;letter-spacing:-.02em}
.brand-name small{display:block;font-family:var(--body);font-weight:500;font-size:10.5px;color:var(--accent);letter-spacing:.18em;margin-top:4px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.nav-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt3);padding:14px 12px 7px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--txt2);font-weight:600;font-size:14.5px;transition:.16s;position:relative;}
.nav-item svg{width:19px;height:19px;flex-shrink:0;stroke-width:2}
.nav-item:hover{background:var(--panel);color:var(--txt)}
.nav-item.active{background:linear-gradient(90deg,rgba(198,255,61,.16),rgba(198,255,61,.04));color:var(--txt)}
.nav-item.active::before{content:"";position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:4px;height:22px;border-radius:0 4px 4px 0;background:var(--accent)}
.nav-item .badge{margin-left:auto;background:var(--accent);color:#0a0e14;font-size:11px;font-weight:800;padding:1px 8px;border-radius:20px;font-family:var(--mono)}
.side-foot{margin-top:auto;padding:14px 12px 4px;border-top:1px solid var(--line);font-size:11.5px;color:var(--txt3);line-height:1.5}
.side-foot b{color:var(--txt2)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:30px}
.topbar{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);background:rgba(10,14,20,.72);border-bottom:1px solid var(--line);padding:16px 30px;display:flex;align-items:center;gap:16px;}
.topbar h1{font-family:var(--disp);font-size:23px;font-weight:800;letter-spacing:-.02em}
.topbar .sub{color:var(--txt3);font-size:13px;margin-top:2px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.kpi{display:flex;flex-direction:column;align-items:flex-end;padding:0 14px;border-left:1px solid var(--line)}
.kpi b{font-family:var(--mono);font-size:16px;font-weight:700}
.kpi span{font-size:10.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em}
.kpi b.pos{color:var(--green)} .kpi b.neg{color:var(--red)}
.content{padding:26px 30px;max-width:1240px;width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:11px;font-weight:700;font-size:14px;transition:.16s;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);}
.btn:hover{border-color:var(--line2);background:var(--panel3)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#9be23a);color:#0a210f;border:none;box-shadow:0 6px 20px rgba(198,255,61,.22)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;border:1px solid var(--line2)}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:9px}
.section-title{display:flex;align-items:center;gap:10px;margin:28px 0 14px;font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:-.01em}
.section-title .dot{width:9px;height:9px;border-radius:3px;background:var(--accent)}
.section-title .hint{margin-left:auto;font-family:var(--body);font-size:12px;color:var(--txt3);font-weight:500}
.crest{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:15px;color:#fff;flex-shrink:0;position:relative;overflow:hidden;letter-spacing:-.02em}
.crest::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 28% 20%,rgba(255,255,255,.4),transparent 55%);mix-blend-mode:overlay}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stagger>*{animation:fade .4s ease both}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--green);color:#08210f;font-weight:800;padding:13px 22px;border-radius:13px;z-index:200;box-shadow:0 14px 40px rgba(39,209,124,.4);transition:.35s;opacity:0;font-size:14px}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:860px){
  .sidebar{display:none}
  .topbar{padding:14px 16px}
  .content{padding:18px 14px 90px}
  .topbar h1{font-size:20px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">V</div>
      <div class="brand-name">Foot Value Bet<small>Value Engine</small></div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="side-foot">
      API-Football intégrée · v1.0
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="sub" id="pageSub">Chargement...</div>
      </div>
      <div class="topbar-right" id="topKpis"></div>
    </div>
    <div class="content" id="content">
      <div class="card" style="padding:40px;text-align:center;">
        <h2>⚙️ Initialisation</h2>
        <p style="color:var(--txt2);margin-top:10px;">Bienvenue dans Foot Value Bet!</p>
        <p style="color:var(--txt3);font-size:13px;margin-top:20px;">Aller aux <strong>Paramètres</strong> pour configurer votre clé API.</p>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// État global
const state = {
  page: 'dashboard',
  settings: {
    apiKey: localStorage.getItem('foot-value-bet-apiKey') || '',
    currency: 'EUR',
    bankroll: 0,
  }
};

// Données
const LEAGUES = {
  l1: {name: 'Ligue 1'},
  pl: {name: 'Premier League'},
  wc: {name: 'Coupe du Monde'},
};

// API
const FOOTBALL_API = {
  BASE: 'https://foot-value-bet.vercel.app/api/proxy',
  cache: { standings: {}, matches: {}, teamStats: {} },

  getApiKey() { return state.settings.apiKey || ''; },

  async fetchTeamStats(teamId, season) {
    const apiKey = this.getApiKey();
    if (!apiKey) throw new Error('Clé API non configurée');
    
    try {
      let url = this.BASE + '?endpoint=fixtures&team=' + teamId;
      
      // ✅ CORRECTION: SOIT season SOIT from/to, pas les deux!
      if (teamId && parseInt(teamId) > 1000) {
        // Équipes nationales: from/to SANS season
        url += '&from=2023-01-01&to=2026-06-30';
      } else {
        // Clubs: season
        url += '&season=2024';
      }
      
      console.log('📡 Fetching:', url);
      
      const res = await fetch(url, {
        headers: { 'x-apisports-key': apiKey }
      });
      
      if (!res.ok) throw new Error('HTTP ' + res.status);
      
      const json = await res.json();
      const matches = json.response || [];
      
      console.log('✓ Matches:', matches.length);
      
      if (matches.length === 0) {
        return { wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, form: 'NNNNN', totalMatches: 0 };
      }
      
      let wins = 0, draws = 0, losses = 0, gf = 0, ga = 0, form = '';
      
      matches.forEach(m => {
        const isHome = m.teams.home.id == teamId;
        const myGoals = isHome ? m.goals.home : m.goals.away;
        const oppGoals = isHome ? m.goals.away : m.goals.home;
        gf += myGoals;
        ga += oppGoals;
        if (myGoals > oppGoals) wins++;
        else if (myGoals === oppGoals) draws++;
        else losses++;
      });
      
      const last5 = matches.slice(0, 5);
      last5.forEach(m => {
        const isHome = m.teams.home.id == teamId;
        const myGoals = isHome ? m.goals.home : m.goals.away;
        const oppGoals = isHome ? m.goals.away : m.goals.home;
        if (myGoals > oppGoals) form = 'V' + form;
        else if (myGoals === oppGoals) form = 'D' + form;
        else form = 'L' + form;
      });
      
      console.log('✓ Stats:', {wins, draws, losses, gf, ga, form});
      return { wins, draws, losses, gf, ga, form, totalMatches: matches.length };
      
    } catch (err) {
      console.error('❌ Error:', err);
      return null;
    }
  },

  getTeamStats(teamId) {
    return this.cache.teamStats[teamId] || null;
  }
};

// UI
function renderNav() {
  const nav = document.getElementById('nav');
  const pages = [
    {id: 'dashboard', label: 'Dashboard'},
    {id: 'settings', label: 'Paramètres'},
  ];
  nav.innerHTML = '<div class="nav-label">Navigation</div>' + 
    pages.map(p => `<a class="nav-item ${state.page === p.id ? 'active' : ''}" onclick="go('${p.id}')" style="cursor:pointer;">${p.label}</a>`).join('');
}

function renderTopKpis() {
  const el = document.getElementById('topKpis');
  el.innerHTML = `<div class="kpi"><b>API</b><span>${state.settings.apiKey ? '✅' : '❌'}</span></div>`;
}

function render() {
  renderNav();
  renderTopKpis();
  const content = document.getElementById('content');
  
  if (state.page === 'dashboard') {
    content.innerHTML = `
      <div class="card" style="padding:40px;text-align:center;">
        <h2>📊 Dashboard</h2>
        <p style="color:var(--txt2);margin-top:10px;">API-Football intégrée!</p>
        <button class="btn btn-primary" style="margin-top:20px;" onclick="testAPI()">Tester l'API</button>
      </div>
    `;
  } else if (state.page === 'settings') {
    content.innerHTML = `
      <div class="card" style="padding:30px;">
        <h2 style="margin-bottom:20px;">⚙️ Paramètres</h2>
        <div style="margin-bottom:20px;">
          <label style="display:block;margin-bottom:8px;font-weight:700;">Clé API-Football</label>
          <input type="password" id="apiKeyInput" value="${state.settings.apiKey}" placeholder="Votre clé API" style="width:100%;padding:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt);border-radius:8px;">
          <p style="font-size:12px;color:var(--txt3);margin-top:8px;">Obtenez une clé sur: <a href="https://www.api-football.com/" target="_blank" style="color:var(--accent);">api-football.com</a></p>
        </div>
        <button class="btn btn-primary" onclick="saveAPI()" style="width:100%;">Sauvegarder</button>
      </div>
    `;
  }
}

function go(page) {
  state.page = page;
  render();
}

async function testAPI() {
  if (!state.settings.apiKey) {
    toast('Clé API manquante!', true);
    return;
  }
  
  toast('Test en cours...');
  try {
    // Test avec France (ID 1090)
    const stats = await FOOTBALL_API.fetchTeamStats('1090');
    if (stats && stats.totalMatches > 0) {
      toast(`✅ France: ${stats.totalMatches} matchs, Form: ${stats.form}`);
    } else {
      toast('⚠️ Pas de données trouvées', true);
    }
  } catch (err) {
    toast('Erreur API: ' + err.message, true);
  }
}

function saveAPI() {
  const apiKey = document.getElementById('apiKeyInput').value;
  state.settings.apiKey = apiKey;
  localStorage.setItem('foot-value-bet-apiKey', apiKey);
  toast('✅ Clé sauvegardée!');
}

function toast(msg, err) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = err ? 'var(--red)' : 'var(--green)';
  el.style.color = err ? '#fff' : '#08210f';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// Initialiser
render();
</script>
</body>
</html>
