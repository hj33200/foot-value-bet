            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--txt3)">
              <div>${d.won}W / ${d.lost}L</div>

function matchCard(m){
  const d=getMatchData(m.id);const md=d.model;
  
  // Chercher les vraies cotes Unibet pour 1X2
  let o1, ox, o2;
  const cachedData = window.REAL_ODDS_CACHE?.[m.id];
  const realOdds = cachedData?.data || cachedData;  // ← Extraire .data si présent!
  
  if(realOdds && realOdds['Unibet'] && realOdds['Unibet'].markets?.['Match Winner']) {
    const cotes = realOdds['Unibet'].markets['Match Winner'];
    try {
      const v1 = parseFloat(cotes[0]?.odd);
      const vx = parseFloat(cotes[1]?.odd);
      const v2 = parseFloat(cotes[2]?.odd);
      
      o1 = !isNaN(v1) ? v1.toFixed(2) : mkQuick(md.pH);
      ox = !isNaN(vx) ? vx.toFixed(2) : mkQuick(md.pD);
      o2 = !isNaN(v2) ? v2.toFixed(2) : mkQuick(md.pA);
    } catch(e) {
      console.warn('Erreur parsing cotes:', e);
      o1 = mkQuick(md.pH);
      ox = mkQuick(md.pD);
      o2 = mkQuick(md.pA);
    }
  } else {
    // Fallback sur les cotes du modèle
    o1 = mkQuick(md.pH);
    ox = mkQuick(md.pD);
    o2 = mkQuick(md.pA);
  }
  
  return `
  <div class="card match-card" onclick="openDetailWrapper('${m.id}')">
    <div class="mc-top">
      <span class="mc-league">${flag(m.lg)} ${LEAGUES[m.lg].name}</span>
      ${statusTag(m.status)}
    </div>
    <div class="mc-teams">
      <div class="mc-team">${crest(m.home)}<span class="nm">${m.home.name}</span></div>
      <div class="mc-mid"><span class="mc-time">${m.time}</span><span class="mc-vs">VS</span></div>
      <div class="mc-team">${crest(m.away)}<span class="nm">${m.away.name}</span></div>
    </div>
    <div class="mc-odds">
      <div class="mc-odd"><span>1</span><b>${o1}</b></div>
      <div class="mc-odd"><span>N</span><b>${ox}</b></div>
      <div class="mc-odd"><span>2</span><b>${o2}</b></div>
    </div>
    <div class="mc-foot">
      <button class="btn btn-primary btn-sm" style="flex:1" onclick="event.stopPropagation();openDetailWrapper('${m.id}')">
        Voir l'analyse ${iconSvg('M5 12h14M13 5l7 7-7 7')}</button>
    </div>
  </div>`;
}
function mkQuick(p){return r2(1/(p*1.06)).toFixed(2)}

async function openDetail(id){
  state.selectedMatchId = id;
  const m = MATCHES.find(x => x.id === id);
  
  // L'ID du match EST le fixtureId de l'API-Football
  const fixtureId = m?.id || m?.fixture?.id;
  
  // Invalider immédiatement le cache
  delete matchCache[id];
  
  // Aller à la page Détail
  go('detail');
  
  // Récupérer les vraies cotes EN ARRIÈRE-PLAN
  if(m && fixtureId) {
    
    // Afficher un spinner de chargement
    showLoadingOverlay('Chargement cotes réelles...');
    
    try {
      const realOdds = await fetchOddsFromAPIFootball(fixtureId);
      hideLoadingOverlay();
      
      
      if(realOdds) {
        // Stocker les cotes dans le cache global avec timestamp
        if(!window.REAL_ODDS_CACHE) window.REAL_ODDS_CACHE = {};
        window.REAL_ODDS_CACHE[id] = {
          data: realOdds,
          timestamp: Date.now()  // ⏰ Ajouter le timestamp
        };
        
        // Invalider le cache et forcer le re-render
        delete matchCache[id];
        render();
        toast('✅ Cotes réelles chargées');
      } else {
        console.warn(`⚠️⚠️⚠️ Cotes réelles NULL`);
        toast('⚠️ Cotes réelles non disponibles');
      }
    } catch(err) {
      hideLoadingOverlay();
      console.error('❌❌❌ Erreur lors du chargement des cotes:', err);
      toast('❌ Erreur cotes');
    }
  } else {
    console.warn(`⚠️ Pas de fixtureId trouvé pour ce match! fixtureId=${fixtureId}`);
  }
}

function statsSection(d){
  const H=d.statsH,A=d.statsA,m=d.meta;
  
  // DEBUG: Afficher les 5 derniers matchs de chaque équipe
  const getLast5Debug = async (teamId) => {
    const apiKey = state.settings.apiKey;
    if (!apiKey) return [];
    const today = new Date().toISOString().split('T')[0];
    const url = FOOTBALL_API.BASE + '?endpoint=fixtures&team=' + teamId + '&from=2023-01-01&to=' + today;
    try {
      const res = await fetch(url, { headers: { 'x-apisports-key': apiKey } });
      const json = await res.json();
      const matches = json.response || [];
      const sortedMatches = matches.filter(m => m.goals.home !== null && m.goals.away !== null)
        .sort((a, b) => new Date(a.fixture.date) - new Date(b.fixture.date));
      const last5 = sortedMatches.slice(-5);
      return last5.map(m => ({
        date: m.fixture.date.slice(0,10),
        home: m.teams.home.name,
        away: m.teams.away.name,
        hg: m.goals.home,
        ag: m.goals.away,
        isHome: m.teams.home.id == teamId,
        result: m.teams.home.id == teamId 
          ? (m.goals.home > m.goals.away ? 'V' : m.goals.home < m.goals.away ? 'L' : 'D')
          : (m.goals.away > m.goals.home ? 'V' : m.goals.away < m.goals.home ? 'L' : 'D')
      }));
    } catch (e) {
      console.error('Debug error:', e);
      return [];

// 🎯 SCORING COMBINÉ: VALUE (40%) + STATS (60%)
function combinedScore(sel) {
  if(!sel.value || sel.est == null) return -Infinity;
  
  const valueScore = (sel.value * 100); // En % (-100 à +100)
  
  // Score STATS: 100% si ≥75%, 75% si 50-75%, 50% si 25-50%, 0% si <25%
  let statsScore = 0;
  if(sel.est >= 0.75) statsScore = 100;
  else if(sel.est >= 0.50) statsScore = 75;
  else if(sel.est >= 0.25) statsScore = 50;
  else statsScore = 0;
  
  // Score combiné: VALUE (40%) + STATS (60%)
  return (valueScore * 0.4) + (statsScore * 0.6);
}

function editOddCote(marketId, selIdx) {
  const d = getMatchData(state.selectedMatchId);
  const mk = d.markets.find(x => x.id === marketId);
  const s = mk.sels[selIdx];
  
  if(!s) return;
  
  const coteCourante = s.cote ? s.cote.toFixed(2) : '';
  const nouvelleCote = prompt(`Éditer la cote pour "${s.sel}"\n\nNouvelle cote:`, coteCourante);
  
  if(nouvelleCote === null) return; // Annulé
  
  const newCote = parseFloat(nouvelleCote);
  if(isNaN(newCote) || newCote < 1.01) {
    alert('❌ Cote invalide! (minimum 1.01)');
    return;
  }
  
  // Mettre à jour la cote
  s.cote = newCote;
  s.implied = 1 / newCote;
  s.est = s.est || 0.5; // Si pas d'estimation, utiliser 0.5
  s.value = s.est * newCote - 1;
  s.kelly = ((newCote - 1) * s.est - (1 - s.est)) / (newCote - 1);
  s.color = voyantColor(s.value, s.est);
  s.coteManuellementModifiee = true;
  s.realCote = null; // Indiquer que c'est une cote manuelle
  
  
  toast(`✏️ Cote modifiée: ${newCote.toFixed(2)} • Value: ${(s.value*100).toFixed(1)}%`);
  
  // Invalider le cache pour forcer le re-render
  delete matchCache[state.selectedMatchId];
  render();
}

// 🎯 ÉVALUER LA VALUE (edge %)
function evaluateValue(value) {
  if (value >= 0.05) return { level: '✅ EXCELLENT', color: 'var(--green)', desc: 'Edge très solide (≥5%)' };
  if (value >= 0.02) return { level: '⚠️ CORRECT', color: 'var(--orange)', desc: 'Légère edge (2-5%)' };
  return { level: '❌ FAIBLE', color: 'var(--red)', desc: 'Pas assez de value (<2%)' };
}

// 📊 ÉVALUER LA PROBABILITÉ STATS
function evaluateStats(probability) {
  if (probability >= 0.75) return { level: '✅ TRÈS PROBABLE', color: 'var(--green)', desc: '≥75% de chances' };
  if (probability >= 0.50) return { level: '⚠️ PROBABLE', color: 'var(--orange)', desc: '50-75% de chances' };
  return { level: '❌ INCERTAIN', color: 'var(--red)', desc: '<50% de chances' };
}

// 🎯 COMBINER VALUE + STATS POUR RECOMMANDATION
function combineVerdicts(valueEval, statsEval, value, probability) {
  const valueTier = value >= 0.05 ? 'excel' : value >= 0.02 ? 'correct' : 'low';
  const statsTier = probability >= 0.75 ? 'high' : probability >= 0.50 ? 'med' : 'low';
  
  // Matrice de recommandations
  const matrix = {
    'excel-high': { emoji: '🔥', type: 'TOP PARI', desc: 'Excellent edge + Stats fortes = À PRENDRE' },
    'excel-med': { emoji: '⭐', type: 'BON PARI', desc: 'Bon edge mais moins certain = Potentiel élevé' },
    'excel-low': { emoji: '🎲', type: 'HAUT RISQUE', desc: 'Excellent edge mais incertain = À risque' },
    'correct-high': { emoji: '🛡️', type: 'SAFE PARI', desc: 'Edge faible mais très probable = Risque faible' },
    'correct-med': { emoji: '💭', type: 'COIN FLIP', desc: 'Faible edge et probas équilibrées = À réfléchir' },
    'correct-low': { emoji: '⚠️', type: 'À ÉVITER', desc: 'Faible edge et probabilité basse = Mauvais' },

            <strong style="margin-top: 6px; display: block;">P(${team} remboursé) = ${(prob * 100).toFixed(1)}%</strong>
          </div>
        </div>
      </div>
    `;
  }
  
  // First Half
  if (b.marketId === 'htr') {
    const opts = [
      { label: b.home.name, prob: m.pHT_1 },
      { label: 'Nul', prob: m.pHT_D },
      { label: b.away.name, prob: m.pHT_2 }
    ];
    const sel = opts[b.selIdx];
    
    return `
      <div class="detail-section">
        <h4>📊 L'analyse Résultat mi-temps</h4>
        <p><strong>${b.matchName}:</strong> Résultat à la 45ème minute</p>
        
        <div style="background: var(--bg); border-radius: 8px; padding: 10px; margin: 10px 0; font-size: 12px;">
          <div style="margin-bottom: 8px;"><strong>Probabilités (45 minutes)</strong></div>
          <div style="margin-left: 12px; color: var(--txt2);">
            Lambda ajusté: λ/2 pour chaque équipe<br><br>
            ${b.home.name}: ${m.pHT_1 ? (m.pHT_1 * 100).toFixed(1) : '—'}%<br>
            Nul: ${m.pHT_D ? (m.pHT_D * 100).toFixed(1) : '—'}%<br>
            ${b.away.name}: ${m.pHT_2 ? (m.pHT_2 * 100).toFixed(1) : '—'}%
          </div>
        </div>
        
        <div style="background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 8px; padding: 10px; margin: 10px 0; font-size: 12px;">
          <strong>Votre sélection:</strong>
          <div style="margin-left: 12px; margin-top: 6px; color: var(--txt2);">
            ${sel.label}: <strong style="color: var(--accent); font-size: 13px;">${(sel.prob * 100).toFixed(1)}%</strong>
          </div>
        </div>
      </div>
    `;
  }
  
  // Home Over/Under
  if (b.marketId === 'hou') {
    const opts = [{label:'> 1.5',prob:m.ou15Home?.pOver},{label:'> 2.5',prob:m.ou25Home?.pOver},{label:'> 3.5',prob:m.ou35Home?.pOver}];
    const sel = opts[b.selIdx];
    return `<div class="detail-section"><h4>📊 ${b.home.name} Over/Under</h4><p>${b.matchName}</p><div style="background:var(--bg);border-radius:8px;padding:10px;margin:10px 0;font-size:12px;"><div style="margin-left:12px;color:var(--txt2);">${opts[0].label}: ${(opts[0].prob*100).toFixed(1)}%<br>${opts[1].label}: ${(opts[1].prob*100).toFixed(1)}%<br>${opts[2].label}: ${(opts[2].prob*100).toFixed(1)}%</div></div></div>`;
  }
  
  // Away Over/Under
  if (b.marketId === 'aou') {
    const opts = [{label:'> 1.5',prob:m.ou15Away?.pOver},{label:'> 2.5',prob:m.ou25Away?.pOver},{label:'> 3.5',prob:m.ou35Away?.pOver}];
    const sel = opts[b.selIdx];
    return `<div class="detail-section"><h4>📊 ${b.away.name} Over/Under</h4><p>${b.matchName}</p><div style="background:var(--bg);border-radius:8px;padding:10px;margin:10px 0;font-size:12px;"><div style="margin-left:12px;color:var(--txt2);">${opts[0].label}: ${(opts[0].prob*100).toFixed(1)}%<br>${opts[1].label}: ${(opts[1].prob*100).toFixed(1)}%<br>${opts[2].label}: ${(opts[2].prob*100).toFixed(1)}%</div></div></div>`;
  }
  
  // Correct Score
  if (b.marketId === 'score') {
    return `<div class="detail-section"><h4>📊 Score Exact</h4><p>${b.matchName}</p><div style="background:var(--bg);border-radius:8px;padding:10px;margin:10px 0;font-size:12px;"><div>Poisson 2D: λHome=${m.lambdaHome ? m.lambdaHome.toFixed(2) : '—'}, λAway=${m.lambdaAway ? m.lambdaAway.toFixed(2) : '—'}</div><div style="margin-top:6px;"><strong>Score sélectionné: ${b.est ? (b.est*100).toFixed(1) : '—'}%</strong></div></div></div>`;
  }
  
  // HT/FT Double
  if (b.marketId === 'htft') {
    const htftLabel = {
      '1/1': `${b.home.name} en HT et FT`,
      '1/N': `${b.home.name} en HT, Nul en FT`,
      '1/2': `${b.home.name} en HT, ${b.away.name} en FT`,
      'N/1': `Nul en HT, ${b.home.name} en FT`,
      'N/N': `Nul en HT et FT`,
      'N/2': `Nul en HT, ${b.away.name} en FT`,
      '2/1': `${b.away.name} en HT, ${b.home.name} en FT`,
      '2/N': `${b.away.name} en HT, Nul en FT`,
      '2/2': `${b.away.name} en HT et FT`
    };
    
    const combinations = Object.entries(m.HTFT || {})
      .sort((a,b) => b[1] - a[1])
      .slice(0, 5)
      .map(([k, p]) => `${k}: ${(p*100).toFixed(1)}%`)
      .join('<br>');
    
    return `<div class="detail-section"><h4>📊 HT/FT</h4><p>${b.matchName}</p><div style="background:var(--bg);border-radius:8px;padding:10px;margin:10px 0;font-size:12px;"><div style="margin-bottom:8px;"><strong>Combinaison sélectionnée:</strong></div><div style="margin-left:12px;color:var(--txt2);">${htftLabel[b.sel] || b.sel}</div></div><div style="background:var(--bg);border-radius:8px;padding:10px;margin:10px 0;font-size:12px;"><div style="margin-bottom:8px;"><strong>Top 5 combinaisons HT/FT:</strong></div><div style="margin-left:12px;color:var(--txt2);font-size:11px;">${combinations}</div></div><div style="background:rgba(59, 130, 246, 0.1);border: 1px solid rgba(59, 130, 246, 0.3);border-radius:8px;padding:10px;margin:10px 0;font-size:12px;"><strong>Probabilité estimée: ${b.est ? (b.est*100).toFixed(1) : '—'}%</strong><div style="margin-top:6px;font-size:11px;color:var(--txt2);">Basé sur simulation Monte Carlo 100k matchs avec momentum factor</div></div></div>`;
  }
  
  if (b.marketId === 'cs') {
    const isHome = b.selIdx % 2 === 0; // 0,2 = Home / 1,3 = Away
    const team = isHome ? b.home.name : b.away.name;
    const lambda = isHome ? m.lambdaAway : m.lambdaHome;
    const csProb = isHome ? m.csHome : m.csAway;
    
    return `
      <div class="detail-section">
        <h4>📊 L'analyse Clean Sheet</h4>
        <p><strong>${b.matchName}:</strong> Quelle est la probabilité que ${team} ne concède aucun but?</p>
        
        <div style="background: var(--bg); border-radius: 8px; padding: 10px; margin: 10px 0; font-size: 12px;">
          <div style="margin-bottom: 8px;"><strong>1️⃣ Buts attendus de l'adversaire</strong></div>
          <div style="margin-left: 12px; color: var(--txt2);">
            Lambda ${isHome ? b.away.name : b.home.name}: <strong>${lambda ? lambda.toFixed(2) : '—'}</strong> buts/match
            <div style="font-size: 11px; margin-top: 4px; color: var(--txt3);">
              Basé sur attaque, défense, Elo et SOS de l'adversaire
            </div>
          </div>
        </div>

        <div style="background: var(--bg); border-radius: 8px; padding: 10px; margin: 10px 0; font-size: 12px;">
          <div style="margin-bottom: 8px;"><strong>2️⃣ Distribution Poisson (0 buts)</strong></div>
          <div style="margin-left: 12px; color: var(--txt2);">
            P(0 buts) = e^(-λ) = e^(-${lambda ? lambda.toFixed(2) : '—'})
            <div style="font-size: 11px; margin-top: 4px; color: var(--txt3);">
              Probabilité que l'adversaire ne marque pas
            </div>
          </div>
        </div>

        <div style="background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 8px; padding: 10px; margin: 10px 0; font-size: 12px;">
          <strong>📈 Résultat Clean Sheet:</strong>
          <div style="margin-left: 12px; margin-top: 6px; color: var(--txt2);">
            P(${team} Clean Sheet) = <strong style="color: var(--accent); font-size: 13px;">${csProb ? (csProb * 100).toFixed(1) : '—'}%</strong>
          </div>
        </div>
      </div>
    `;
  }
  
  // Par défaut: analyse 1N2
  return `
    <div class="detail-section">
      <h4>📊 L'analyse détaillée</h4>
      <p><strong>${b.matchName}:</strong> L'Elo brut suggère une probabilité élevée, mais notre modèle ajuste pour plusieurs facteurs:</p>
      
      <div style="background: var(--bg); border-radius: 8px; padding: 10px; margin: 10px 0; font-size: 12px;">
        <div style="margin-bottom: 8px;"><strong>1️⃣ Force ELO brute</strong></div>
        <div style="margin-left: 12px; color: var(--txt2);">
          ${b.home.name}: <strong>${m.homeElo ? m.homeElo.toFixed(0) : '—'}</strong> Elo
          → <strong>${m.eloWinProb ? (m.eloWinProb * 100).toFixed(1) : '—'}%</strong> victoire (Elo seul)
        </div>
        <div style="margin-left: 12px; color: var(--txt2);">
          ${b.away.name}: <strong>${m.awayElo ? m.awayElo.toFixed(0) : '—'}</strong> Elo
          → <strong>${m.eloWinProb ? ((1-m.eloWinProb) * 100).toFixed(1) : '—'}%</strong> victoire
        </div>
      </div>

      <div style="background: var(--bg); border-radius: 8px; padding: 10px; margin: 10px 0; font-size: 12px;">
        <div style="margin-bottom: 8px;"><strong>2️⃣ Force des adversaires (SOS)</strong></div>
        <div style="margin-left: 12px; color: var(--txt2);">
          <strong>${b.home.name} SOS: ${m.sosHome ? m.sosHome.toFixed(3) : '—'}</strong>
          ${m.sosHome && m.sosHome > 1 ? '⚠️ Adversaires TRÈS forts' : '✅ Adversaires faibles'}
          <div style="font-size: 11px; margin-top: 4px; color: var(--txt3);">
            ${m.sosHome && m.sosHome > 1 
              ? `Joué contre des équipes fortes → +${(m.sosHome * 100 - 100).toFixed(1)}% plus difficile → Stats RÉELLES et impressionnantes!` 
              : `Joué contre des équipes faibles → Stats GONFLÉES/exagérées!`}
          </div>
        </div>
      </div>

      <div style="background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 8px; padding: 10px; margin: 10px 0; font-size: 12px;">
        <strong>📈 Résumé du calcul:</strong>
        <div style="margin-left: 12px; margin-top: 6px; color: var(--txt2);">
          <strong>1️⃣ Elo brut (référence):</strong> ${m.eloRawProb ? m.eloRawProb.toFixed(1) : '—'}%<br>
          <strong>2️⃣ Multiplicateur Elo:</strong> ${m.eloMultiplier ? m.eloMultiplier.toFixed(2) : '—'}x<br>
          <strong>3️⃣ Ajustement Attaque/Défense + SOS:</strong> ${m.sosHome ? (m.sosHome * 100 - 100).toFixed(1) : '—'}%<br>
          <strong>4️⃣ Forme récente (5 derniers matchs):</strong> ${m.homeFormMult ? ((m.homeFormMult - 1) * 100).toFixed(0) : '—'}% ${m.homeFormMult > 1.2 ? '💪' : m.homeFormMult < 0.8 ? '💔' : '➡️'}<br>
          <br><strong style="color: var(--accent); font-size: 13px;">📊 Probabilité finale: ${
            ((b.marketId === '1n2' 
              ? (b.selIdx === 0 ? m.pH : b.selIdx === 2 ? m.pA : m.pD)
              : (b.selIdx % 2 === 0 ? m.pH : m.pA)
            ) * 100).toFixed(1)
          }%</strong>
          <div style="font-size: 11px; color: var(--txt3); margin-top: 6px;">
            30% historique + 70% Elo (Coupe du Monde) + Forme récente
          </div>
        </div>
      </div>
    </div>
  `;
}

function updateEst(v){
  const b=state.pendingBet;b.est=v/100;
  const value=b.est*b.cote-1;
  const kelly=((b.cote-1)*b.est-(1-b.est))/(b.cote-1);
  const kStake=Math.max(0,kelly)*state.settings.bankroll*kellyFrac();
  b._kStake=kStake;
  document.getElementById('estRv').textContent=v;
  document.getElementById('cEst').textContent=pct(b.est);
  document.getElementById('cVal').textContent=(value>=0?'+':'')+pct(value);
  const cell=document.getElementById('cValCell');
  cell.className='calc-cell '+(value>=state.settings.greenMin?'value-pos':value<state.settings.yellowMin?'value-neg':'');
  const ksv=document.getElementById('kStakeVal');
  if(ksv){ksv.textContent=kStake.toFixed(2)+' '+curSym();document.getElementById('kellyPct').textContent=(Math.max(0,kelly)*100).toFixed(1)}
}

// 🎯 Toggle détails du verdict
function toggleDetails(btn) {
  const details = btn.nextElementSibling;
  details.style.display = details.style.display === 'none' ? 'block' : 'none';
  btn.textContent = details.style.display === 'none' ? '▼ Pourquoi cette différence? (SOS, Elo, etc.)' : '▲ Masquer les détails';

function updateConfDisplay(){
  const conf=state.pendingBet.conf;
  const stars=['❌','⭐','⭐⭐','⭐⭐⭐','⭐⭐⭐⭐','⭐⭐⭐⭐⭐'][Math.min(5,Math.floor(conf/2))];

function useKelly(){const v=(state.pendingBet._kStake||0).toFixed(2);const inp=document.getElementById('stakeInput');inp.value=v;state.pendingBet.stake=v}
function confirmBet(){
  const b=state.pendingBet;
  const stake=parseFloat(b.stake);
  if(!stake||stake<=0){toast('Saisissez une mise valide',true);return}
  state.bets.unshift(freshBet({
    matchId:b.matchId,matchName:b.matchName,league:b.league,market:b.market,sel:b.sel,
    cote:b.cote,stake:stake,est:b.est,value:b.est*b.cote-1,conf:b.conf,note:b.note,status:'attente'
  }));
  // ✅ SAUVEGARDER EN LOCALSTORAGE
  localStorage.setItem('foot-value-bet-bets', JSON.stringify(state.bets));
  showModal(false);go('bets');toast('Pari ajouté ✓');
}
function showModal(v){const el=document.getElementById('modalBack');el.classList.toggle('show',v);if(!v)state.pendingBet=null}

// 🔄 FONCTION: Rafraîchir les cotes du match
function refreshOdds() {
  const matchId = state.selectedMatchId;
  if(!matchId) return;
  
  // Supprimer le cache du match
  if(window.REAL_ODDS_CACHE && window.REAL_ODDS_CACHE[matchId]) {
    delete window.REAL_ODDS_CACHE[matchId];
  }
  
  console.log(`🔄 Refresh manuel des cotes pour matchId=${matchId}`);
  
  // Recharger la modal (force le recalcul des cotes)
  if(state.pendingBet) {
    const {market, sel} = state.pendingBet;
    const markets = state.allMatches.find(x => x.id === matchId)?.markets || [];
    const mk = markets.find(x => x.name === market);
    if(mk) {
      const selIdx = mk.sels.findIndex(x => x.sel === sel);
      openBetModal(mk.id, selIdx);
    }
  }
}

function matchCell(b){

function statusSelect(b){
  return `<select class="status-sel" onchange="changeStatus('${b.id}',this.value)">

function changeStatus(id,val){
  const idx=state.bets.findIndex(b=>b.id===id);if(idx<0)return;
  const bet=state.bets[idx];bet.status=val;
  if(val==='attente'){
    localStorage.setItem('foot-value-bet-bets', JSON.stringify(state.bets));
    render();return
  }
  // move to history
  state.bets.splice(idx,1);
  state.history.unshift(bet);
  // ✅ SAUVEGARDER EN LOCALSTORAGE
  localStorage.setItem('foot-value-bet-bets', JSON.stringify(state.bets));
  localStorage.setItem('foot-value-bet-history', JSON.stringify(state.history));

const histFilter={date:'',league:'all',status:'all',market:'all',value:'all'};
function viewHistory(){
  const markets=[...new Set(state.history.map(b=>b.market))];
  const leagues=[...new Set(state.history.map(b=>b.league))];
  let rows=state.history.filter(b=>{
    if(histFilter.league!=='all'&&b.league!==histFilter.league)return false;
    if(histFilter.status!=='all'&&b.status!==histFilter.status)return false;
    if(histFilter.market!=='all'&&b.market!==histFilter.market)return false;
    if(histFilter.date&&!b.date.includes(histFilter.date))return false;
    if(histFilter.value==='pos'&&b.value<state.settings.greenMin)return false;
    if(histFilter.value==='neg'&&b.value>=0)return false;
    return true;
  });
  const wins=state.history.filter(b=>b.status==='gagne').length;
  const closed=state.history.filter(b=>b.status!=='annule').length;
  const profit=state.history.reduce((a,b)=>a+profitOf(b),0);
  const staked=state.history.reduce((a,b)=>a+(+b.stake||0),0);
  const roi=staked?profit/staked*100:0;

  const body=rows.length?rows.map(b=>{
    const gain=(+b.stake*b.cote)||0;const pl=profitOf(b);
    const res=b.status==='gagne'?`<span style="color:var(--green)">+${pl.toFixed(0)}${curSym()}</span>`:b.status==='perdu'?`<span style="color:var(--red)">${pl.toFixed(0)}${curSym()}</span>`:'<span style="color:var(--txt3)">remb.</span>';
    return `<tr>
      <td class="t-mono" style="font-size:12px">${b.date}</td>
      <td>${matchCell(b)}</td>
      <td>${b.league}</td>
      <td>${b.market}</td>
      <td style="font-weight:700">${b.sel}</td>

      <td class="t-mono">${gain.toFixed(0)}${curSym()}</td>
      <td>${res}</td>
      <td>${statusPill(b.status)}</td>
      <td class="profit ${pl>=0?'pos':'neg'}">${pl>=0?'+':''}${pl.toFixed(2)}${curSym()}</td>
      <td>${valBadge(b.value)}</td>
      <td><span class="conf"><b>${b.conf}</b><span style="color:var(--txt3)">/10</span></span></td>
      <td class="t-note">${b.note||'—'}</td>
    </tr>`;
  }).join(''):`<tr><td colspan="14"><div class="empty">Aucun pari ne correspond aux filtres.</div></td></tr>`;

  return `
  <div class="stat-cards">
    <div class="card scard"><div class="lab">Profit / Perte</div><div class="num ${profit>=0?'pos':'neg'}">${profit>=0?'+':''}${profit.toFixed(0)}${curSym()}</div></div>
    <div class="card scard"><div class="lab">ROI</div><div class="num ${roi>=0?'pos':'neg'}">${roi>=0?'+':''}${roi.toFixed(1)}%</div></div>
    <div class="card scard"><div class="lab">Paris clôturés</div><div class="num">${state.history.length}</div><div class="sub">${wins} gagné(s)</div></div>
    <div class="card scard"><div class="lab">Taux de réussite</div><div class="num">${closed?Math.round(wins/closed*100):0}%</div></div>
  </div>
  <div class="card filters fade">
    <div class="field"><label>Date contient</label><input type="text" placeholder="ex: 05/2026" value="${histFilter.date}" oninput="histFilter.date=this.value;render()"></div>
    <div class="field"><label>Championnat</label><select onchange="histFilter.league=this.value;render()">
      <option value="all">Tous</option>${leagues.map(l=>`<option ${histFilter.league===l?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="field"><label>Statut</label><select onchange="histFilter.status=this.value;render()">
      <option value="all">Tous</option><option value="gagne" ${histFilter.status==='gagne'?'selected':''}>Gagné</option>
      <option value="perdu" ${histFilter.status==='perdu'?'selected':''}>Perdu</option>
      <option value="annule" ${histFilter.status==='annule'?'selected':''}>Annulé</option></select></div>
    <div class="field"><label>Type de pari</label><select onchange="histFilter.market=this.value;render()">
      <option value="all">Tous</option>${markets.map(mm=>`<option ${histFilter.market===mm?'selected':''}>${mm}</option>`).join('')}</select></div>
    <div class="field"><label>Value</label><select onchange="histFilter.value=this.value;render()">
      <option value="all" ${histFilter.value==='all'?'selected':''}>Toutes</option>
      <option value="pos" ${histFilter.value==='pos'?'selected':''}>Value positive</option>
      <option value="neg" ${histFilter.value==='neg'?'selected':''}>Value négative</option></select></div>
  </div>
  <div class="section-title"><span class="dot"></span>Historique des paris <span class="hint">${rows.length} résultat(s)</span></div>
  <div class="table-wrap fade">
    <table>
      <thead><tr><th>Date</th><th>Match</th><th>Championnat</th><th>Marché</th><th>Sélection</th><th>Cote</th><th>Mise</th><th>Gain pot.</th><th>Résultat</th><th>Statut final</th><th>Profit/Perte</th><th>Value</th><th>Conf.</th><th>Notes</th></tr></thead>
      <tbody>${body}</tbody>
    </table>
  </div>`;
}

  }
}

function computeStatsFromMatches(matches) {
  const stats = {};
  const finished = matches.filter(m => m.status === 'FINISHED' && m.score && m.score.home != null);
  finished.forEach(m => {
    const hId = m.homeTeamId, aId = m.awayTeamId;
    const hg = m.score.home, ag = m.score.away;
    if (!stats[hId]) stats[hId] = { gf: 0, ga: 0, matches: 0, results: [] };
    if (!stats[aId]) stats[aId] = { gf: 0, ga: 0, matches: 0, results: [] };
    stats[hId].gf += hg; stats[hId].ga += ag; stats[hId].matches++;
    stats[aId].gf += ag; stats[aId].ga += hg; stats[aId].matches++;
    stats[hId].results.push({ date: m.date, result: hg > ag ? 'W' : hg < ag ? 'L' : 'D' });
    stats[aId].results.push({ date: m.date, result: ag > hg ? 'W' : ag < hg ? 'L' : 'D' });
  });
  Object.keys(stats).forEach(id => {
    const sorted = stats[id].results.sort((a, b) => a.date - b.date);
    stats[id].form = sorted.slice(-5).map(r => r.result);
  });
  return stats;
}

// 🎯 Charger les vraies cotes 1X2 pour tous les matchs du dashboard
async function loadRealOddsForDashboard() {
  if(!MATCHES || MATCHES.length === 0) return;
  
  
  // Charger les cotes en parallèle (max 5 à la fois pour ne pas surcharger)
  const batchSize = 5;
  for(let i = 0; i < MATCHES.length; i += batchSize) {
    const batch = MATCHES.slice(i, i + batchSize);
    const promises = batch.map(m => {
      // Vérifier si le cache est valide (moins de 5 minutes)
      let needsFetch = !window.REAL_ODDS_CACHE?.[m.id];
      if(window.REAL_ODDS_CACHE?.[m.id]) {
        const cacheAge = Date.now() - (window.REAL_ODDS_CACHE[m.id].timestamp || 0);
        needsFetch = cacheAge > 5 * 60 * 1000;  // Plus de 5 minutes = rechargement
      }
      
      if(needsFetch) {
        return fetchOddsFromAPIFootball(m.id)
          .then(odds => {
            if(odds) {
              if(!window.REAL_ODDS_CACHE) window.REAL_ODDS_CACHE = {};
              window.REAL_ODDS_CACHE[m.id] = {
                data: odds,
                timestamp: Date.now()  // ⏰ Ajouter le timestamp
              };
            }
          })
          .catch(err => console.warn(`⚠️ Erreur cotes ${m.id}:`, err));
      }
    });
    
    await Promise.all(promises);
  }
  
  // Re-rendre le dashboard avec les vraies cotes
  render();
}

async function loadDashboardMatches() {
  const leagueKey = state.filterLeague === 'all' ? 'l1' : state.filterLeague;
  const dateISO = state.filterDate; // Already in ISO format (YYYY-MM-DD)
  try {
    showLoadingOverlay('Chargement des matchs...');
    const allMatches = await FOOTBALL_API.fetchMatchesByDate(leagueKey, dateISO);
    const teamStats = computeStatsFromMatches(allMatches);
    let standings = null;
    if (!FOOTBALL_API.LEAGUES[leagueKey].multiGroup) {
      try {
        if (!FOOTBALL_API.cache.standings[leagueKey]) await FOOTBALL_API.fetchStandings(leagueKey);
        standings = FOOTBALL_API.cache.standings[leagueKey]?.data?.teams;
      } catch (e) {}
    }
    hideLoadingOverlay();
    
    const dayMatches = allMatches.filter(m => m.dateISO === dateISO);
    const colors = ['#004b9b','#cc0000','#ff6600','#1d5c8a','#dd0000','#ff0066','#ffd700','#00a8ff','#8b0000','#d40000','#0066cc','#00a86b','#ff8c00','#800080','#ff0000','#228b22','#4169e1','#003366'];
    let cIdx = 0;
    
    const ensureTeam = (tId, tName, tShort) => {
      let st = null;
      if (standings) st = standings.find(t => t.id === tId);
      const s = st ? { gf: st.gf, ga: st.ga, matches: st.played, form: st.form } : teamStats[tId] || { gf: 1, ga: 1, matches: 1, form: [] };
      TEAMS[tId] = {
        id: tId, name: tName, short: tShort,
        color: colors[(cIdx++) % colors.length],
        gf: Math.max(s.gf, 1), ga: Math.max(s.ga, 1),
        matches: Math.max(s.matches, 1), apiForm: s.form || [],
      };
      return TEAMS[tId];
    };
    
    const newMatches = dayMatches.map(m => ({
      id: m.id, lg: leagueKey,
      home: ensureTeam(m.homeTeamId, m.homeTeam, m.homeTeamShort),
      away: ensureTeam(m.awayTeamId, m.awayTeam, m.awayTeamShort),
      time: m.time, status: m.status === 'LIVE' ? 'live' : m.status === 'FINISHED' ? 'done' : 'up',
      date: m.dateStr, score: m.score,
    }));
    
    MATCHES.splice(0, MATCHES.length, ...newMatches);
    matchCache = {};
    state.footballDataReady = true;
    toast(newMatches.length + ' match(s)');
    
    // 🔴 IMPORTANT: ATTENDRE le chargement des vraies cotes AVANT de re-render!
    await loadRealOddsForDashboard();  // ← Ajouter await!
    render();  // ← Appeler render() APRÈS les vraies cotes!
  } catch (err) {
    hideLoadingOverlay();
    console.error('Load error:', err);
    alert('❌ ERREUR:\n\n' + err.message + '\n\nConsole F12 pour les logs');
  }
}



async function loadAndApplyRealData() {
  const data = await loadRealLeagueData('l1');
  if (!data) return;
  
  // Create dynamic team mapping from real data
  const newTeams = {};
  data.teams.slice(0, 18).forEach((team, idx) => {
    const key = 't' + idx; // Simple key: t0, t1, t2...
    newTeams[key] = {
      id: key,
      name: team.name,
      short: team.short,
      color: ['#004b9b','#cc0000','#ff6600','#ffffff','#dd0000','#ff0066','#ffd700','#00a8ff','#8b0000','#d40000','#1d5c8a','#0066cc','#ff6600','#000000','#ff0000','#ffffff','#0066cc','#003366'][idx] || '#' + Math.random().toString(16).slice(2,8),
      gf: team.gf,
      ga: team.ga,
      matches: team.matches || 34,
    };
  });
  
  // Replace TEAMS
  Object.assign(TEAMS, newTeams);
  
  // Update MATCHES with scheduled/live matches
  const upcomingMatches = data.matches
    .filter(m => m.status === 'SCHEDULED' || m.status === 'LIVE')
    .slice(0, 6)
    .map((m, i) => {
      // Find home/away team in newTeams
      const homeTeamKey = Object.keys(newTeams).find(k => newTeams[k].name === m.homeTeam);
      const awayTeamKey = Object.keys(newTeams).find(k => newTeams[k].name === m.awayTeam);
      
      return {
        id: 'm' + (i + 1),
        lg: 'l1',
        home: TEAMS[homeTeamKey] || { id: 't0', name: m.homeTeam, short: m.homeTeam.substring(0,3), color: '#999' },
        away: TEAMS[awayTeamKey] || { id: 't1', name: m.awayTeam, short: m.awayTeam.substring(0,3), color: '#999' },
        time: new Date(m.date).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
        status: m.status === 'LIVE' ? 'live' : 'up',
        date: new Date(m.date).toLocaleDateString('fr-FR'),
      };
    });
  
  MATCHES.splice(0, MATCHES.length, ...upcomingMatches);
  matchCache = {};
  
  alert('✅ Données Ligue 1 réelles chargées!\n\n' + 
    data.teams.length + ' équipes, ' + 
    upcomingMatches.length + ' matchs à venir\n\n' +
    'Les stats réelles (GF/GA) sont maintenant utilisées pour les pronostics!');
  
  go('dashboard');
}
