        <div class="seg">
          <button class="${s.kellyMode==='full'?'on':''}" onclick="state.settings.kellyMode='full';render()">Plein</button>
          <button class="${s.kellyMode==='half'?'on':''}" onclick="state.settings.kellyMode='half';render()">Demi</button>
          <button class="${s.kellyMode==='quarter'?'on':''}" onclick="state.settings.kellyMode='quarter';render()">Quart</button>
        </div>
      </div>
    </div>

    <div class="card set-block">
      <h3>Bookmakers favoris</h3>
      <div class="desc">Sources de cotes à comparer.</div>
      <div class="chips">${s.bookmakersAll.map(bm=>`<button class="chip ${s.bookmakers.includes(bm)?'on':''}" onclick="toggleBookmaker('${bm}')">${bm}</button>`).join('')}</div>
    </div>

    <div class="card set-block">
      <h3>Championnats favoris</h3>
      <div class="desc">Affichés en priorité sur le dashboard.</div>
      <div class="chips">${Object.entries(LEAGUES).map(([k,v])=>`<button class="chip ${s.favLeagues.includes(k)?'on':''}" onclick="toggleFavLeague('${k}')">${v.name}</button>`).join('')}</div>
    </div>

    <div class="card set-block">
      <h3>Seuils des voyants value</h3>
      <div class="desc">Définissez à partir de quelle value le voyant passe au vert / jaune.</div>
      <div class="set-field"><label>Seuil VERT (value ≥) — actuel ${(s.greenMin*100).toFixed(0)}%</label>
        <div class="range-wrap"><input type="range" min="0" max="20" value="${s.greenMin*100}" oninput="state.settings.greenMin=+this.value/100;clearCache();render()"><span class="rv">${(s.greenMin*100).toFixed(0)}%</span></div></div>
      <div class="set-field"><label>Seuil JAUNE (value ≥) — actuel ${(s.yellowMin*100).toFixed(0)}%</label>
        <div class="range-wrap"><input type="range" min="-10" max="10" value="${s.yellowMin*100}" oninput="state.settings.yellowMin=+this.value/100;clearCache();render()"><span class="rv">${(s.yellowMin*100).toFixed(0)}%</span></div></div>
      <div style="font-size:12px;color:var(--txt3);margin-top:6px">En dessous du seuil jaune ⇒ <span style="color:var(--red)">No bet</span>. Sans probabilité estimée ⇒ <span style="color:var(--txt2)">données insuffisantes</span>.</div>
    </div>

    <div class="card set-block">
      <h3>Modèle de données</h3>
      <div class="desc">Entités synchronisées avec API-Football (à venir).</div>
      <div class="db-schema">
        ${['User','UserSettings','League','Team','Match','Standing','Odds','Prediction','Bet'].map(e=>`<span class="ent">${e}</span>`).join('')}
      </div>
      <div style="font-size:12px;color:var(--txt3);margin-top:14px;line-height:1.6">
        <b style="color:var(--txt2)">Formules utilisées :</b><br>
        Prob. implicite = 1 / cote<br>
        Value = prob. estimée × cote − 1<br>
        Kelly = ((cote−1) × p − (1−p)) / (cote−1)
      </div>
    </div>
  </div>`;
}
function toggleBookmaker(bm){const a=state.settings.bookmakers;const i=a.indexOf(bm);i<0?a.push(bm):a.splice(i,1);render()}
function toggleFavLeague(k){const a=state.settings.favLeagues;const i=a.indexOf(k);i<0?a.push(k):a.splice(i,1);render()}
function clearCache(){for(const k in matchCache)delete matchCache[k]}

/* ---------- shared ---------- */
function emptyState(t,s){return `<div class="card"><div class="empty">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
  <div style="font-size:16px;font-weight:700;color:var(--txt2)">${t}</div>
  <div style="margin-top:6px">${s}</div>
  <button class="btn btn-primary btn-sm" style="margin-top:16px" onclick="go('dashboard')">Aller au dashboard</button>
</div></div>`}

let toastTimer;
function toast(msg,err){
  const el=document.getElementById('toast');
  el.textContent=msg;el.style.background=err?'var(--red)':'var(--green)';
  el.style.color=err?'#fff':'#08210f';
  el.classList.add('show');clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

/* ---------- boot ---------- */
render();

function showLoadingOverlay(msg) {
  let el = document.getElementById('loading-overlay');
  if (el) el.remove();
  el = document.createElement('div');
  el.id = 'loading-overlay';
  el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column';
  el.innerHTML = '<div style="width:50px;height:50px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px"></div><div style="color:var(--txt);font-size:14px">' + msg + '</div>';
  document.body.appendChild(el);
}

function hideLoadingOverlay() {
  const el = document.getElementById('loading-overlay');
  if (el) el.remove();
}



async function testAndInitAPI() {
  if (!state.settings.apiKey) {
    alert('Entre ta cle API api-football.com!');
    return;
  }
  try {
    await FOOTBALL_API.initAllStandings();
    state.footballDataReady = true;
    alert('✅ API ok!\n\nVa au Dashboard:\n- Choisis un championnat\n- Choisis une date\n- Clique Charger les matchs');
    go('dashboard');
  } catch (err) {
    state.footballDataReady = true;
    alert('Erreur API: ' + err.message + '\n\nVa quand meme au Dashboard!');
    go('dashboard');
  }
}

function computeStatsFromMatches(matches) {
  const stats = {};
  const finished = matches.filter(m => m.status === 'FINISHED' && m.score && m.score.home != null);
  finished.forEach(m => {
    const hId = m.homeTeamId, aId = m.awayTeamId;
    const hg = m.score.home, ag = m.score.away;
    if (!stats[hId]) stats[hId] = { gf: 0, ga: 0, matches: 0, results: [] };
    if (!stats[aId]) stats[aId] = { gf: 0, ga: 0, matches: 0, results: [] };
    stats[hId].gf += hg; stats[hId].ga += ag; stats[hId].matches++;
    stats[aId].gf += ag; stats[aId].ga += hg; stats[aId].matches++;
    stats[hId].results.push({ date: m.date, result: hg > ag ? 'W' : hg < ag ? 'L' : 'D' });
    stats[aId].results.push({ date: m.date, result: ag > hg ? 'W' : ag < hg ? 'L' : 'D' });
  });
  Object.keys(stats).forEach(id => {
    const sorted = stats[id].results.sort((a, b) => a.date - b.date);
    stats[id].form = sorted.slice(-5).map(r => r.result);
  });
  return stats;
}

async function loadDashboardMatches() {
  const leagueKey = state.filterLeague === 'all' ? 'l1' : state.filterLeague;
  const dateISO = state.filterDate; // Already in ISO format (YYYY-MM-DD)
  try {
    showLoadingOverlay('Chargement des matchs...');
    const allMatches = await FOOTBALL_API.fetchMatchesByDate(leagueKey, dateISO);
    const teamStats = computeStatsFromMatches(allMatches);
    let standings = null;
    if (!FOOTBALL_API.LEAGUES[leagueKey].multiGroup) {
      try {
        if (!FOOTBALL_API.cache.standings[leagueKey]) await FOOTBALL_API.fetchStandings(leagueKey);
        standings = FOOTBALL_API.cache.standings[leagueKey]?.data?.teams;
      } catch (e) {}
    }
    hideLoadingOverlay();
    
    const dayMatches = allMatches.filter(m => m.dateISO === dateISO);
    const colors = ['#004b9b','#cc0000','#ff6600','#1d5c8a','#dd0000','#ff0066','#ffd700','#00a8ff','#8b0000','#d40000','#0066cc','#00a86b','#ff8c00','#800080','#ff0000','#228b22','#4169e1','#003366'];
    let cIdx = 0;
    
    const ensureTeam = (tId, tName, tShort) => {
      let st = null;
      if (standings) st = standings.find(t => t.id === tId);
      const s = st ? { gf: st.gf, ga: st.ga, matches: st.played, form: st.form } : teamStats[tId] || { gf: 1, ga: 1, matches: 1, form: [] };
      TEAMS[tId] = {
        id: tId, name: tName, short: tShort,
        color: colors[(cIdx++) % colors.length],
        gf: Math.max(s.gf, 1), ga: Math.max(s.ga, 1),
        matches: Math.max(s.matches, 1), apiForm: s.form || [],
      };
      return TEAMS[tId];
    };
    
    const newMatches = dayMatches.map(m => ({
      id: m.id, lg: leagueKey,
      home: ensureTeam(m.homeTeamId, m.homeTeam, m.homeTeamShort),
      away: ensureTeam(m.awayTeamId, m.awayTeam, m.awayTeamShort),
      time: m.time, status: m.status === 'LIVE' ? 'live' : m.status === 'FINISHED' ? 'done' : 'up',
      date: m.dateStr, score: m.score,
    }));
    
    MATCHES.splice(0, MATCHES.length, ...newMatches);
    matchCache = {};
    state.footballDataReady = true;
    toast(newMatches.length + ' match(s)');
    render();
  } catch (err) {
    hideLoadingOverlay();
    console.error('Load error:', err);
    alert('❌ ERREUR:\n\n' + err.message + '\n\nConsole F12 pour les logs');
  }
}



async function loadAndApplyRealData() {
  const data = await loadRealLeagueData('l1');
  if (!data) return;
  
  // Create dynamic team mapping from real data
  const newTeams = {};
  data.teams.slice(0, 18).forEach((team, idx) => {
    const key = 't' + idx; // Simple key: t0, t1, t2...
    newTeams[key] = {
      id: key,
      name: team.name,
      short: team.short,
      color: ['#004b9b','#cc0000','#ff6600','#ffffff','#dd0000','#ff0066','#ffd700','#00a8ff','#8b0000','#d40000','#1d5c8a','#0066cc','#ff6600','#000000','#ff0000','#ffffff','#0066cc','#003366'][idx] || '#' + Math.random().toString(16).slice(2,8),
      gf: team.gf,
      ga: team.ga,
      matches: team.matches || 34,
    };
  });
  
  // Replace TEAMS
  Object.assign(TEAMS, newTeams);
  
  // Update MATCHES with scheduled/live matches
  const upcomingMatches = data.matches
    .filter(m => m.status === 'SCHEDULED' || m.status === 'LIVE')
    .slice(0, 6)
    .map((m, i) => {
      // Find home/away team in newTeams
      const homeTeamKey = Object.keys(newTeams).find(k => newTeams[k].name === m.homeTeam);
      const awayTeamKey = Object.keys(newTeams).find(k => newTeams[k].name === m.awayTeam);
      
      return {
        id: 'm' + (i + 1),
        lg: 'l1',
        home: TEAMS[homeTeamKey] || { id: 't0', name: m.homeTeam, short: m.homeTeam.substring(0,3), color: '#999' },
        away: TEAMS[awayTeamKey] || { id: 't1', name: m.awayTeam, short: m.awayTeam.substring(0,3), color: '#999' },
        time: new Date(m.date).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
        status: m.status === 'LIVE' ? 'live' : 'up',
        date: new Date(m.date).toLocaleDateString('fr-FR'),
      };
    });
  
  MATCHES.splice(0, MATCHES.length, ...upcomingMatches);
  matchCache = {};
  
  alert('✅ Données Ligue 1 réelles chargées!\n\n' + 
    data.teams.length + ' équipes, ' + 
    upcomingMatches.length + ' matchs à venir\n\n' +
    'Les stats réelles (GF/GA) sont maintenant utilisées pour les pronostics!');
  
  go('dashboard');
}
